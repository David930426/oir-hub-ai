<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supersession Labeling</title>
<style>
:root{--bg:#f7f7f5;--panel:#fff;--ink:#1d1d1b;--mute:#6b6b66;--line:#e2e1dc;--acc:#2455c3;--upd:#b4540a;--new:#1f7a3a;--red:#6b4fb5;--sel:#eef3ff}
@media (prefers-color-scheme:dark){:root{--bg:#151514;--panel:#1e1e1c;--ink:#ecebe6;--mute:#9a9992;--line:#34332f;--acc:#7da2ff;--upd:#f0a060;--new:#6fcf8f;--red:#b9a4ff;--sel:#23304d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,"Noto Sans TC","Microsoft JhengHei",sans-serif}
header{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header b{font-size:15px}
.grow{flex:1}
button,select,input,textarea{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 9px}
button{cursor:pointer}button:hover{border-color:var(--acc)}
main{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:14px 16px}
@media (max-width:900px){main{grid-template-columns:1fr}}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
h2{margin:0 0 4px;font-size:16px}
.meta{color:var(--mute);font-size:12px}
.text{white-space:pre-wrap;word-break:break-word;max-height:60vh;overflow:auto;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.cand{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:8px 0}
.cand.on{background:var(--sel);border-color:var(--acc)}
.cand .t{font-weight:600}
.cand .x{white-space:pre-wrap;word-break:break-word;color:var(--mute);font-size:13px;max-height:7.5em;overflow:hidden}
.cand.open .x{max-height:none}
.cand label{display:flex;gap:8px;align-items:baseline;cursor:pointer}
.labels{display:flex;gap:8px;margin:4px 0 12px}
.labels button{flex:1;padding:10px;font-weight:700;letter-spacing:.02em}
.labels button[data-l=UPDATE].on{background:var(--upd);color:#fff;border-color:var(--upd)}
.labels button[data-l=NEW].on{background:var(--new);color:#fff;border-color:var(--new)}
.labels button[data-l=REDUNDANT].on{background:var(--red);color:#fff;border-color:var(--red)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0}
textarea{width:100%;min-height:54px}
.kbd{font-size:11px;color:var(--mute)}
#search{width:100%}
#hits div{padding:4px 6px;cursor:pointer;border-radius:4px}#hits div:hover{background:var(--sel)}
.pill{display:inline-block;padding:0 7px;border-radius:9px;font-size:12px;border:1px solid var(--line)}
.done{color:var(--new)}
</style>
</head>
<body>
<header>
  <b>Supersession labeling</b><span class="pill" id="corpus"></span>
  <button id="prev" title="k / ←">◀</button>
  <input id="jump" size="5" aria-label="case number">
  <span id="pos"></span>
  <button id="next" title="j / →">▶</button>
  <button id="nextOpen">next unlabeled</button>
  <label><input type="checkbox" id="kappaOnly"> κ subset only</label>
  <span class="grow"></span>
  <span id="progress"></span>
  <input id="annot" size="4" placeholder="initials" aria-label="annotator initials">
  <button id="export">Export CSV</button>
  <label><button id="importBtn">Import CSV</button><input type="file" id="import" accept=".csv" hidden></label>
</header>
<main>
  <section>
    <div class="meta">INCOMING · <span id="caseId"></span></div>
    <h2 id="inTitle"></h2>
    <div class="meta" id="inMeta"></div>
    <div class="text" id="inText"></div>
  </section>
  <section>
    <div class="labels">
      <button data-l="UPDATE">UPDATE <span class="kbd">u</span></button>
      <button data-l="NEW">NEW <span class="kbd">n</span></button>
      <button data-l="REDUNDANT">REDUNDANT <span class="kbd">r</span></button>
    </div>
    <div class="row">
      <label>changed field
        <select id="field"><option value=""></option><option>cycle</option><option>deadline</option><option>fee</option><option>eligibility</option><option>procedure</option><option>link</option><option>other</option></select>
      </label>
      <label><input type="checkbox" data-flag="unsure"> unsure</label>
      <label><input type="checkbox" data-flag="template_trap"> template_trap</label>
      <label><input type="checkbox" data-flag="reworded"> reworded</label>
      <label><input type="checkbox" data-flag="translation"> translation</label>
      <label><input type="checkbox" data-flag="old_predecessor"> old_predecessor</label>
    </div>
    <textarea id="notes" placeholder="notes (why this label)"></textarea>
    <div class="meta" style="margin-top:10px">KNOWLEDGE BASE CANDIDATES — tick the target(s) for UPDATE / REDUNDANT. <span class="kbd">1–9 toggle · click text to expand</span></div>
    <div id="cands"></div>
    <input id="search" placeholder="Not listed? Search older documents by title…">
    <div id="hits"></div>
  </section>
</main>
<script>
const DATA = {"corpus": "local", "docs": {"local-126b3742": ["2024年春全球姊妹校交換計畫甄選簡章_1012", "2023-10-12", "東海大學赴全球姊妹校交換甄試簡章 General Information for Outbound Exchange Application P1 \n \n東海大學國際暨兩岸合作處\n \n2024年春學期東海大學赴全球姊妹校交換甄試簡章 \n \n赴姊妹校交換學期：2024年春季學期(部分姊妹校2024年秋季) \n \n甄試宗旨 \n東海大學國際暨兩岸合作處(以下簡稱國際處)舉辦本甄試，以兼顧公平性與多元性、善盡大學\n社會責任，鼓勵在校學生自我挑戰，前往全球姊妹校進行一學期或一學年的交換學習。藉以\n提升本校學生全球視野與移動力，累積、深化海外國際化經驗。 \n \n申請資格 \n• 本校修業滿一學期的在學學生(不含碩士在職專班) \n• 赴全球姐妹校交換學習期間需具備本校在學身分 \n• 在學期間可進行至多兩次的一學期交換學習；部分開放一學年的交換學習僅限一次 \n \n相關費用 \n• 赴全球姐妹校交換學習期間，需完成本校註冊與繳納本校全額學雜費(免繳姊妹校學雜費) \n• 交換學生需自行負擔來回機票、簽證費、生活費、書籍費等相關個人支出 \n• 交換學生甄試報名費新台幣伍佰元整；報名費繳交後概不退費 \n• 獲錄取交換學生需繳交學習保證金新台幣壹萬元整；如符合以下任一條件者得申請退還 \n(1) 於姊妹校規定期限前完成所有文件繳交及相關作業程序，但未通過姊妹校審核 \n(2) 因不可抗力或特殊因素無法赴姊妹校交換學習 \n(3) 完成交換學習返國後，依據國際處規定於期限前繳交學習心得報告 \n• 東海大學高等教育深耕計畫得訂定相關補助辦法，鼓勵本校學生赴全球姊妹校交換學習 \n• 具中華民國國籍並在台灣設有戶籍學生得申請教育部學海飛颺與惜珠計畫補助 \n \n \n \n \n\n \n東海大學赴全球姊妹校交換甄試簡章 General Information for Outbound Exchange Application P2 \n \n東海大學國際暨兩岸合作處\n重要日程(節錄) \n2023年8-10月 \n日期 \n事項 \n備註 \n8月30(三) \n公告甄選簡章 \n12：00網路報名 \n10月2日(一) \n報名截止 \n14:00 \n10月4日(三) \n公告口試場次表 \n16:00 \n10月6日(五) \n口試 \n \n10月12日(四) \n公告選填學校場次(唱名順序) \n14:00 \n10月13日(五) \n選填學校 \n09:00 \n10月19日(四) \n推薦資格確認書截止收件(繳交保證金) \n16:00 \n重要日程 (1) \n2023年8月30日(三)中午12點：國際處首頁「最新消息」公告本甄試簡章 \n2023年8月30日(三)中午12點至2023年10月2日(一)下午2點：完成甄試報名 \n• 完成網路報名 \n網址：https://forms.gle/dJSBWT28Fa1qFTbj6 \n• 繳交以下文件至國際處 \n(1) 註課組列印之名次證明書 \n(2) 註課組列印之歷年成績單(中文版)： \n(3) 選繳下列外語能力檢定證明正本與影本(正本驗還) \n• 英語能力檢定：ITP托福、iBT托福、雅思 \n• 日語能力檢定：日本語能力檢定N5至N1 \n• 英語檢定及日語能力檢定，請以成績最高者擇一提交 \n• 正本查驗期限：口試當天。口試結束前如無法提供正本查驗則視為無成績或以當時\n最優成績計。 \n(4) 領取繳費單至出納組繳交報名費新台幣500元整；報名費繳交後概不退費 \n• 完成繳件後不再接受補件、更換文件 \n重要日程 (2) \n2023年10月4日(三)下午4點：國際處首頁「最新消息」公告口試場次表 \n2023年10月6日(五)上午9點起：進行口試 \n 1.依據口試場次表進行團體口試 \n2.團體口試階段、場次、時間及人數依據總申請人數設定 \n3.口試語言為中文；母語非中文同學得以英文進行口試 \n4.請於口試場次開始前15分鐘報到 \n5.口試內容：30秒自我介紹、1分鐘個人抽選題、及開放討論題 \n(1)自我介紹：請於30秒內提示姓名、系級、目標選填學校、個人傑出表現 \n(2)個人抽選題：請於1分鐘內簡要回答全球視野與移動力相關問題 \n(3)開放討論題：可包含個人申請動機、交換學習計畫、人格特質；目標選填學校所在區 \n域的時事分享與討論、其他有利審查表現等議題積極展現赴海外學習的潛力並與口試教 \n師互動 \n  N2 \n14 早稻田大學 \nWaseda University \n1 \n3.0 80 \n6.0 N1 \n \n附註：部分未列入名單的日、韓姊妹校亦開放本校學生自費交換，詳請洽國際處。", ""], "local-d40cd843": ["2024年秋全球姊妹校交換計畫甄選簡章_0314", "2024-03-14", "東海大學赴全球姊妹校交換甄試簡章 General Information for Outbound Exchange Application P1 \n \n東海大學國際暨兩岸合作處\n \n2024年秋學期東海大學赴全球姊妹校交換甄試簡章 \n \n赴姊妹校交換學期：2024年秋季學期(部分姊妹校2025年春季) \n \n甄試宗旨 \n東海大學國際暨兩岸合作處(以下簡稱國際處)舉辦本甄試，以兼顧公平性與多元性、善盡大學\n社會責任，鼓勵在校學生自我挑戰，前往全球姊妹校進行一學期或一學年的交換學習。藉以\n提升本校學生全球視野與移動力，累積、深化海外國際化經驗。 \n \n申請資格 \n• 本校修業滿一學期的在學學生(不含碩士在職專班) \n• 赴全球姐妹校交換學習期間需具備本校在學身分 \n• 在學期間可進行至多兩次的一學期交換學習；部分開放一學年的交換學習僅限一次 \n \n相關費用 \n• 赴全球姐妹校交換學習期間，需完成本校註冊與繳納本校全額學雜費(免繳姊妹校學雜費) \n• 交換學生需自行負擔來回機票、簽證費、生活費、書籍費等相關個人支出 \n• 交換學生甄試報名費新台幣伍佰元整；報名費繳交後概不退費 \n• 獲錄取交換學生需繳交學習保證金新台幣壹萬元整；如符合以下任一條件者得申請退還 \n(1) 於姊妹校規定期限前完成所有文件繳交及相關作業程序，但未通過姊妹校審核 \n(2) 因不可抗力或特殊因素無法赴姊妹校交換學習 \n(3) 完成交換學習返國後，依據國際處規定於期限前繳交學習心得報告 \n• 東海大學高等教育深耕計畫得訂定相關補助辦法，鼓勵本校學生赴全球姊妹校交換學習 \n• 具中華民國國籍並在台灣設有戶籍學生得申請教育部學海飛颺與惜珠計畫補助 \n \n \n \n \n\n \n東海大學赴全球姊妹校交換甄試簡章 General Information for Outbound Exchange Application P2 \n \n東海大學國際暨兩岸合作處\n重要日程(節錄) \n2024年2-4月 \n日期 \n事項 \n備註 \n2月14(三) \n公告甄選簡章 \n12：00網路報名 \n3月15日(五) \n報名截止 \n14:00 \n3月19日(二) \n公告口試場次表 \n16:00 \n3月22日(五) \n口試 \n \n3月27日(三) \n公告選填學校場次(唱名順序) \n14:00 \n3月29日(五) \n選填學校 \n09:00 \n4月8日(一) \n推薦資格確認書截止收件(繳交保證金) \n16:00 \n重要日程 (1) \n2024年2月14日(三)中午12點：國際處首頁「最新消息」公告本甄試簡章 \n2024年3月15日(五)中午12點至2023年10月2日(一)下午2點：完成甄試報名 \n• 程序一 完成網路報名 \n網址：https://forms.gle/piv9eJ3AQMTFxcbs9 \n• 程序二 繳交以下文件至國際處 \n(1) 註課組列印之名次證明書 \n(2) 註課組列印之歷年成績單(中文版)： \n(3) 選繳下列外語能力檢定證明正本與影本(正本驗還) \n• 英語能力檢定：ITP托福、iBT托福、雅思 \n• 日語能力檢定：日本語能力檢定N5至N1 \n• 韓國語文能力測驗：6~2級 \n• 英語檢定、日語能力檢定、及韓國語文能力測驗，請以成績最高者擇一提交 \n• 正本查驗期限：口試當天。口試結束前如無法提供正本查驗則視為無成績或以當時\n最優成績計。 \n(4) 領取繳費單至出納組繳交報名費新台幣500元整；報名費繳交後概不退費 \n• 完成繳件後不再接受補件、更換文件 \n重要日程 (2) \n2024年3月19日(二)下午4點：國際處首頁「最新消息」公告口試場次表 \n2024年3月22日(五)上午9點起：進行口試 \n 1.依據口試場次表進行團體口試 \n2.團體口試階段、場次、時間及人數依據總申請人數設定 \n3.口試語言為中文；母語非中文同學得以英文進行口試 \n4.請於口試場次開始前15分鐘報到 \n5.口試內容：30秒自我介紹、1分鐘個人抽選題、及開放討論題 \n(1)自我介紹：請於30秒內提示姓名、系級、目標選填學校、個人傑出表現 \n(2)個人抽選題：請於1分鐘內簡要回答全球視野與移動力相關問題 \n(3)開放討論題：可包含個人申請動機、交換學習計畫、人格特質；目標選填學校所在區 \n域的時事分享與討論、其他有利審查表現等議題積極展現赴海外學習的潛力並與口試教 \n師互動 \n6.未參加口試者視同放棄本次甄選。 \n重要日程 (3) \n\n \n東海大學赴全球姊妹校交換甄試簡章 General Information for Outbound Exchange Application P3 \n \n東海大學國際暨兩岸合作處\n2024年3月27日(三)下午2點：國際處首頁公告選填學校場次表 \n• 選填學校場次表依據甄試總成績高低排序，總成績計算評分標準如下： \n1、學業表現(40%)：歷年各學期班排名百分比平均 \n2、團體口試(40%)：由3位跨院教師擔任口試委員，依其成績平均 \n3、外語能力(10%)：依據選繳之外語能力檢定證明加分(如下表) \n4、勞作成績(0~10%)： \n(1)採計方式可用新制(4.0)、或舊制計分。 \n(2)採舊制計分且具兩學期成績者總分10%；僅1學期成績者總分5%、另5%併入口試 \n成績。 \n(3)採新制計分且具兩學期成績者總分2%、其餘8%併入口試成績；僅1學期成績者總 \n分1%、其餘9%併入口試成績。 \n(4)進修學士班、碩博士班學生及尚無勞作成績者本項10%併入口試成績。 \n(5)甄試總成績同分比序：1.學業表現。2.團體口試。 \n• 2024年3月29日(五)上午9點：選填學校 \n• 參加選填學校前請事先擬定1-3所目標學校，並務必確認符合該校所定報名資格及相關規 \n 定與限制 \n• 請於公開選填學校場次開始前15分鐘報到、再次確認選填資格 \n• 選填學校流程： \n 依「選填學校場次表」進行叫號 \n 每位同學需於叫到號時當場決定報名學校(2分鐘內)即完成錄取 \n重要日程 (4) \n2024年4月8日(一)下午4點：錄取學生完成錄取資格確認 \n• 至國際處繳交錄取資格確認文件(推薦資格確認書、家長同意書) \n• 繳交保證金壹萬元(國際處領取繳費單、出納組繳費後繳回收據) \n \n• 未於期限前完成錄取資格確認者視同放棄錄取資格，且在學期間不得再申請交換 \n \n \n \nMinimum Score \nby Level \nTOEFL ITP \nTOEFL iBT \nIELTS \nJLPT \nTOPIK \nLevel A (10%) \n630 \n100 \n8.5 \nN 1 \n6級 \nLevel B(8%) \n560 \n95 \n7.0 \nN 2 \n5級 \nLevel C(6%) \n527 \n72 \n6.0 \nN 3 \n4級 \nLevel D(4%) \n- \n- \n5.5 \nN 4 \n3級 \nLevel E(2%) \n- \n- \n- \nN 5 \n2級 \n\n \n東海大學赴全球姊妹校交換甄試簡章 General Information for Outbound Exchange Application P4 \n \n東海大學國際暨兩岸合作處\n教育部學海飛颺與惜珠計畫 \n學海飛颺計畫 \n教育部為鼓勵成績優秀的本地學生赴海外大專校院(不包括大陸、香港、澳門地區學校)修讀\n學分，特提供學海飛颺計畫獎助金。申請補助資格須為具中華民國國籍、在臺灣地區設有戶\n籍之本地學生，並在本校同一教育階段就讀一學期以上之在學學生。審核標準依據申請學生\n在校期間各學期平均班排名。 \n報名日期 113 年3 月29 日(五)起 至 5 月31 日止 \n報名流程 1.填寫網路表單。2.mail 研修計畫。詳見國際處官網最新消息 \n網路表單網址 https://forms.gle/217DW9ybBXoDwa4a7 \n學海惜珠計畫 \n學海惜珠計畫補助對象應有各直轄市、縣（市）主管機關認定之低收入戶、中低收入戶、特\n殊境遇家庭扶助、身心障礙者生活補助費、弱勢兒童及少年生活扶助、弱勢家庭兒童及少年\n緊急生活扶助及及同一戶籍內具中低收入老人生活津貼補助資格，由教育部核定其補助金\n額。因配合教育部受理申請時程，校內申請截止日期為每年3 月10 日，次年10 月31 日前\n出國交流。 \n \n國際處參考網站 https://ithu.tw/QO8fU \n學海計畫官方網站 https://www.studyabroad.moe.gov.tw/new/school \n \n \n \n\n \n東海大學赴全球姊妹校交換甄試簡章 General Information for Outbound Exchange Application P5 \n \n東海大學國際暨兩 neral Information for Outbound Exchange Application P1 \n \n東海大學國際暨兩岸合作處\n \n2025年春學期東海大學赴全球姊妹校交換甄試簡章 \n \n赴姊妹校交換學期：2025年春季學期(部分姊妹校2025年秋季) \n \n甄試宗旨 \n東海大學國際暨兩岸合作處(以下簡稱國際處)舉辦本甄試，以兼顧公平性與多元性、善盡大學\n社會責任，鼓勵在校學生自我挑戰，前往全球姊妹校進行一學期或一學年的交換學習。藉以\n提升本校學生全球視野與移動力，累積、深化海外國際化經驗。 \n \n申請資格 \n 本校修業滿一學期的在學學生(不含碩士在職專班) \n 赴全球姐妹校交換學習期間需具備本校在學身分 \n 在學期間至境外大學校院研究或修讀課程學分者除修習雙聯學位者外，其餘進修期限均以 \n一年為限。\n為限。 \n \n相關費用 \n 赴全球姐妹校交換學習期間，需完成本校註冊與繳納本校全額學雜費(免繳姊妹校學雜費) \n 交換學生需自行負擔來回機票、簽證費、生活費、書籍費等相關個人支出 \n 交換學生甄試報名費新台幣伍佰元整；報名費繳交後概不退費 \n 獲錄取交換學生需繳交學習保證金新台幣壹萬元整；如符合以下任一條件者得申請退還 \n(1) 於姊妹校規定期限前完成所有文件繳交及相關作業程序，但未通過姊妹校審核 \n(2) 因不可抗力或特殊因素無法赴姊妹校交換學習 \n(3) 完成交換學習返國後，依據國際處規定於期限前繳交學習心得報告 \n 東海大學高等教育深耕計畫得訂定相關補助辦法，鼓勵本校學生赴全球姊妹校交換學習 \n 具中華民國國籍並在台灣設有戶籍學生得申請教育部學海飛颺與惜珠計畫補助 \n \n \n \n \n\n \n東海大學赴全球姊妹校交換甄試簡章 General Information for Outbound Exchange Application P2 \n \n東海大學國際暨兩岸合作處\n重要日程(節錄) \n2024年9月-10月 \n日期 \n事項 \n備註 \n9月2(一) \n公告甄選簡章 \n14:00 開放網路報名 \n9月26日(四) \n報名截止 \n16:00 關閉報名系統 \n10月2日(三) \n公告口試場次表 \n14:00 公告開放查詢 \n10月4日(五) \n口試 \n \n10月14日(一) \n公告選填學校場次(唱名順序) \n14:00 \n10月18日(五) \n唱名(選填學校) \n09:00 \n10月25日(五) \n推薦資格確認書截止收件(繳交保證金) \n16:00 \n重要日程 (1) \n2024年9月2日(一)中午14點：國際處首頁「最新消息」公告本甄試簡章 \n2024年9月26日(四)下午4點：完成網路報名、繳交紙本資料至國際處 \n 程序一 網路報名 \n網址：https://forms.gle/iMGBswijaR6R6mW98 \n 程序二 繳交以下文件至國際處 \n(1) 註課組列印之名次證明書 \n(2) 註課組列印之歷年成績單(中文版)： \n(3) 選繳下列外語能力檢定證明正本與影本(正本驗還) \n 英語能力檢定：ITP托福、iBT托福、雅思 \n 日語能力檢定：日本語能力檢定N5至N1 \n 韓國語文能力測驗：6~2級 \n 英語檢定、日語能力檢定、及韓國語文能力測驗，請以成績最高者擇一提交 \n 正本查驗期限：口試當天。口試結束前如無法提供正本查驗則視為無成績或以當時\n最優成績計。 \n(4) 領取繳費單至出納組繳交報名費新台幣500元整(繳費收據學生自存)；報名費繳交後概\n不退費 \n 完成繳件後不再接受補件、更換文件 \n重要日程 (2) \n2024年10月2日(三)下午4點：國際處首頁「最新消息」公告口試場次表 \n2024年10月4日(五)上午9點起：進行口試 \n 1.依據口試場次表進行團體口試 \n2.團體口試階段、場次、時間及人數依據總申請人數設定 \n3.口試語言為中文；母語非中文同學得以英文進行口試 \n4.請於口試場次開始前15分鐘報到 \n5.口試內容：30秒自我介紹、1分鐘個人抽選題、及開放討論題 \n(1)自我介紹：請於30秒內提示姓名、系級、目標選填學校、個人傑出表現 \n(2)個人抽選題：請於1分鐘內簡要回答全球視野與移動力相關問題 \n(3)開放討論題：可包含個人申請動機、交換學習計畫、人格特質；目標選填學校所在區 \n域的時事分享與討論、其他有利審查表現等議題積極展現赴海外學習的潛力並與口試教 \n師互動 \n6.未參加口試者視同放棄本次甄選。 \n重要日程 (3) \n\n \n東海大學赴全球姊妹校交換甄 res \nthan usual. Also highly quali­\nfied staff to be employed in \nSlovakia (e.g. researchers and \nother \nlisted \nprofessions) \ncan enjoy similar simplified \nnational visa formalities.\nThanks to the simplified rules \nof mobility within EU, even \nnon-EU students, researchers \nwith a residence permit for the \npurpose of study or research \nand development in one of \nthe EU member states can \ncarry out short-term stays \n(up to one year) in another \nEU country (e. g. Slovakia) \nwithout the need to obtain \na temporary residence. The \nsame applies to researcher‘s \nfamily members.\n\nDiscover all the universities\nin Slovakia\nMore than 600 programmes\nin English and other foreign\nlanguages\nHigher education institutions (HEIs) are third level education, scientific and \nart institutions. The major task of HEIs is to provide higher education and \ncreative scientific research or creative artistic activity. Based on founding \nand funding, there are 3 types of HEIs:\nFor detailed information \nabout study programmes \nand fields of study, see: \nwww.portalvs.sk/en\nThe following map allows you to see\nwhat fields of study can be studied in which city\nThe range of STUDY FIELDS students can choose from is wide:\nSecurity sciences,\nDefense and Military\nNatural sciences,\nMathematics, Informatics\nArt\nHumanities\nAgricultural and\nVeterinary Science\nTechnical Sciences \nHealthcare\nPublic HEI\n20x\n3x\n10x\nState HEI\nPrivate HEI\nSocial, Economic\nand Legal Sciences\nEducation\nBanská Bystrica\nAcademy of Fine Arts\nin Banská Bystrica \nwww.aku.sk\nMatej Bel University \nin Banská Bystrica\nwww.umb.sk\nBratislava\nAcademy of Fine Arts and Design\nin Bratislava\nwww.vsvu.sk\nAcademy of Performing Arts\nin Bratislava\nwww.vsmu.sk\nAcademy of the Police Force\nin Bratislava\nwww.akademiapz.sk\nBratislava International\nSchool of Liberal Arts\nwww.bisla.sk\nComenius University in Bratislava\nwww.uniba.sk\nSchool of Economics and\nManagement in Public\nAdm lly offered\nin one of the three levels of higher education:\n5 – 6 years\nMedicine\nVeterinary Medicine\nPharmacy\nBachelor\nStudy\n3-4 years\napp. 240 credits\nMaster\nStudy\n1-2 years\napp. 180 credits\nDoctoral\nPhD.\n3-4 years\nSlovak higher education institutions (HEIs) can offer only accredited study \nprogrammes. The teaching language is Slovak in general, but HEIs also offer \nstudy programmes in other languages (mostly in English, but sometimes \nalso in Hungarian, French, German or Russian).\nVeterinary Medicine\nPharmacy\nThe full degree study in Slovak language is free of charge for the period of stan-\ndard study duration. Generally, tuition fees apply for study programmes \nprovided in a foreign language. However, HEIs can also decide to offer a \nparticular study programme in a foreign language without requesting tuition \nfees. Information on tuition fees and study programmes can be obtained from \nrespective HEIs/faculties.\nThe academic year begins on 1 September of the\ncurrent year and ends on 31 August of the following year.\nIt is composed of 2 semesters (winter semester lasts from September to January \nand summer semester lasts from February to June) or 3 trimesters (organisation \nof the academic year is set by the statute of the faculty or statute of the HEI).\nGrading is based on the ECTS grading scale:\nA\nexcellent\nB\nvery good\nC\ngood\nD\nsatisfactory\nE\nsufficient\nFX\nfail\nFor the assessment of student´s achievements, the credit system following the \nrules of the European Credit Transfer and Accumulation System (ECTS) is used; it \nwas introduced in 2002 for all levels and forms of higher education studies. \nStudent´s standard work load is expressed by the number of credits: 60 credits per \nacademic year and 30 credits per semester. Every HEI determines the total number \nof credits required for the due completion of the study in its respective stages.\nwinter semester\nExam period\nExam period\nSeptember\nDecember\nJanuary\nsummer semester\nFebruary\nJune\nAugust\nSlovak universities participate in several alliances \nwithin the European Universities Initiative: \nComenius University in Bratislava\nENLIGHT Alliance composed\nof 10 European universities\nhttps://enlight-eu.org\nAcademy of Performing Arts in Bratislava\nFILMEU Alliance brings together\n8 European universities\nhttps://www.filmeu.eu\nPavol Jozef Šafárik University in Košice\nis an associated partner of AURORA Alliance \ncomposed of 10 European universities\nhttps://aurora-universities.eu\nSlovak University of Technology Bratislava\nEULiST Alliance composed\nof 10 European universities\nhttps://eulist.university\nSlovak University of Agriculture in Nitra\nINVEST Alliance bringing\ntogether 5 European universities\nhttps://www.invest-alliance.eu\nTrnava University \nKreativEU Alliance bringing together \n11 European universities\nhttps://www.kreativeu.org\nUniversity of Žilina\nPIONEER Allinace integrating 9 European universities \nhttps://pioneer-alliance.eu\nTechnical University of Košice\nULYSSESUS Alliance integrating \n6 European universities\nhttps://ulysseus.eu\nMatej Bel University in Banská \nBystrica\nEMERGE Alliance composed of 9 \nEuropean universities\nhttps://euemerge.eu\n\nScholarships to Slovakia\nInternationalization\nof education and science\nHigher Education Internationalisation \nStrategy \n2030 \naims \nto \nfoster \nacademic mobility of students and \nuniversity staff, and enhance condi-\ntions for studying in Slovakia - more \nstudy programmes in English, easier \nprocedure for visa and residence \npermit, more scholarships, more joint \ndegree programmes, support for \nintegration activities, and other mea-\nsures.\nNational Scholarship\nProgramme of the Slovak Republic\nNSP supports study and research stays of students (1 — 2 \nsemesters), PhD students (1 — 10 months), university teachers, \nresearchers, and artists (1 — 10 months). The scholarships are \navailable to applicants from any country in the world! More \ninformation at: www.scholarships.sk\nAcademic Mobilities\nAcademic Mobilities are scholarships based on bilateral \ngovernmental agreements between Slovakia and various \ncountries in Europe and all over the world. Applicants from \nthese countries can come to Slovakia for study and research \nstays of varying length, summer language courses and other \nmobility formats. Check the available scholarships at: \nwww.grants.saia.sk\nPhD scholarships\nAll admitted PhD students (including \nfrom outside of EU/EEA) are entitled to \na PhD scholarship during the full-time \ndoctoral study.\nErasmus+\nSlovakia is also a part of Erasmus+,\nEU's programme to support education,\ntraining, youth and sport in Europe.\nSearch\nour Database\nof Scholarships\n& Grants\nFind out more\nabout studying\nin Slovakia:\nCEEPUS (Central European Exchange Programme\nfor University Studies)\nCEEPUS supports academic exchange and mobility of students, \nPhD students, university teachers, and researchers from 15 Cen-\ntral and South Eastern European countries. Scholarship stays \ncan range from one week in case of university teachers to one \nacademic year in case of students. More information at:\nwww.ceepus.saia.sk/en\nGovernmental Scholarships\nEvery year, the Ministry of Education, Research, Development \nand Youth of the Slovak Republic awards full study scholarships \nfor all levels of study to applicants from selected countries all \nover the world. More information at: \nhttps://www.vladnestipendia.sk/en/\nVisegrad fund\nInternational Visegrad Fund - as a donor organisation of the \ngovernments of Slovakia, Czech Republic, Poland and Hungary \noffers scholarships, fellowships and residencies supporting \nindividual mobility as well as project grants to foster international \nregional cooperation. More information at: www.visegradfund.org\nAction Austria – Slovakia\nAction Austria – Slovakia, cooperation in Science and Education, \nis an academic exchange programme between Austria and \nSlovakia that provides scholarships for study and research \nstays to students, PhD students, university teachers and \nresearchers, summer language courses and project coopera-\ntion. More information at: www.aktion.saia.sk/de\nEuraxess\nEURAXESS Slovakia is part of the pan-European initiative backed by \nthe European Commission. Free-of-charge, it provides information \nand personalised assistance for researchers and their family \nmembers on various practical matters related to mobility and \nhelps their integration in the new cultural environment. It facilitates \nglobal talent circulation, but also researchers’ career development \nvia various tools, trainings and activities both within and beyond \nacademia. European EURAXESS portal is also hosting the enormous \ndatabase of research jobs and funding opportunities. More infor-\nmation at: www.euraxess.sk or https://euraxess.ec.europa.eu\n\nResearch, development and innovation\nInternational collaborations\nResearch \nin Slovakia\nWide network of public\nresearch institutions\nKey RDI\nchallenges\n45\nInstitutes of Slovak\nAcademy of Sciences\nDigital transformation\n(Industry 4.0)\nDevelopment of Slovak regions,\nincluding area of agriculture\nTransformation to an enviromental\nand energy-efficient economy\n33\n+\nHigher Education\ninstitutions\nSpecialised\nresearch institutes\nPart of European\nResearch Area\nMember of CERN, ESA, XFEL and other\nlarge research infrastructure projects\nR&D & Innovation \nSector in Slovakia \nby SARIO\nSlovak R&D by Sectors\nR&D Personnel by Sectors\nBusiness\nenterprise\nSector\n569 R&D\nOrganizations\n80 %\nGovernment\nSector\n86 R&D\nOrganizations\n12 %\nHigher\nEducation\nSector\n41 R&D\nOrganizations\n6 %\nPrivate\nNon-profit\nSector\n7 R&D\nOrganizations\n1 %\nNumber of R&D\norganizations\nNumber R&D\nPersonnel\nSource: Yearbook of science and technology 2023, www.slovak.statistics.sk\nBusiness\nenterprise\nSector\n13 760\nPersons\n34,7 %\nGovernment\nSe g. Seal of Excellence or other marks of quality) are also foreseen. \nMore information in early 2025 at www.vyskumnaagentura.sk and www.euraxess.sk \nThe Slovak Academy of Sciences also offers various funding schemes for reserachers: \nIMPULZ — for internationally recognised researchers. The task for the excellent scientists is to \ncreate and manage their own research groups which will work on new research directions in \nline with the current world trends. The grant support lasts typically 5 years. More information at: \nhttps://impulz.sav.sk/en \nStefan Schwarz Postdoctoral program — for PhD graduates with not more than 5 years after the \ndate of dissertation defense. The grant support is for 2 to 3 years. More information at: \nhttps://schwarz.sav.sk \nAlso other funding opportunities are managed by SAS. Incentives towards the Seal of Excellence \nin MSCA and similar ERC quality marks within Horizon Europe proposals are considered to be \nreintroduced.\nThere are further funding/job opportunities available at thematic or project level (e.g. in \nquantum technologies http://qute.sk/opportunities/mobility-call/) or at institutional level \n(various universitites have their own postdoc schemes).\nFor several opportunities also see the funding, hosting and job announcements at \nhttps://euraxess.ec.europa.eu/\n\nSAIA, n. o. (Slovak Academic Information Agency) \nis a well-established organisation that focuses \non promoting international mobility and cooperation \nin education and research. We manage scholarship \nprogrammes for international students \nand researchers, and also provide services such as \nguidance, counselling and information about study \nand research opportunities in Slovakia.\nPrepared by SAIA, n. o., 2024\nwww.studyinslovakia.saia.sk\nwww.researchinslovakia.saia.sk\nwww.euraxess.sk\nwww.saia.sk/en\no. (Slovak Academic Information Agency) \nthat focuses\ny and cooperat\nmanage schola\national studen\nprovide servic\nand information\nopportunities in\nSAIA, n. o. (Slovak Academic \nis a well-established organi\non promoting international m\nin education and research\nprogrammes for \nd researchers, an\nnce, counse\nd rese\nSAIA Study \nin Slovakia\nEURAXESS \nSlovakia\nSAIA, n. o.\nSAIA Study \nin Slovakia", ""], "local-b7c6ba2a": ["2025年ICU國際日本暑期課程ISPJ", "2024-10-28", "Communicative\ninteractive \ntask-based \nfor intermediate\nlearners\nA Study of Japan’s\nunique culture,\nsociety, and\nenvironment with\nthe focus on the\n2025 program\ntheme\nOn-Campus\nhousing,\ndiscussions with\nICU students, and\nother activities\nJuly 4–July 25, 2025\nApplication deadline March 1, 2025\nICU International \nSummer Program in Japan \nJapanese\nLanguage \nJapan\nStudies\n…And\nMore !!!\nFind out\nMore\nicu_iee\nTokyo,\nJapan\nCurriculum: Approx.91 hours, 5 credits-worth\n(Approx.48 hours are Japanese language classes)\n\nJSM\nFEATURES\nJapan Studies Module\nFEATURES\nTRADITIONAL\nJAPAN\nCULTURAL \nEXPERIENCES\nCONTEMPORARY\nJAPAN\nCenter for Global Education\nJapanese Language Module\nExplore a Variety of Japanese Culture Programs:\nExamples from 2024 include \nIntermediate Japanese Program\nDeepening Japanese cultural understanding\nICU students participate as volunteers\nEXPAND YOUR WORLD \nIN JAPANESE (ELECTIVES)\nHelp students learn Japanese \nfor academic purposes through \nvarious familiar topics about society and culture. \nLEARN JAPANESE LANGUAGE THROUGH\nEXPERIENCING JAPANESE CULTURES\nTASK-BASED LEARNING\nINTERMEDIATE JAPANESE PROGRAM \n(TWO LEVELS)\nDiverse courses taught by ICU faculty\nStudent-centered approach with lectures, discussions, \nfieldwork and presentations\n Studying together with ICU students\nhttps://sites.google.com/info.icu.ac.jp/icu-ispj/home\nispj@icu.ac.jp\n3-10-2 Osawa, Mitaka, Tokyo 181-8585, JAPAN\nUS AND THEM（ウチとソト）\nWhy do anthropologists of Japan place such a heavy focus on concepts such as 'uchi and soto' and 'honne and\ntatemae' (real intentions and public face)? This program will allow us to look at such concepts from a variety of\nacademic perspectives in an attempt to gain a better understanding of how Japanese society operates.\n2025 PROGRAM THEME \nJLM\nFIELDWORK\nFOUR \nKEY ELEMENTS\nJapanese Calligraphy\nJapanese Martial Art\nOrigami\nJ-pop\nKanji & Vocabulary\nJapanese Eco-Bags(Furoshiki)\nThink and talk in Japanese 1\n　　 (Pre-intermediate level: CEFR B1.1)\nThink and talk in Japanese 2\n　　(Intermediate level: CEFR B1.2)\nWITH 2025 PROGRAM THEME\nDuring the ISPJ2025, we are going to focus on the concepts of 'uchi and soto' from two main perspectives:\n1. 'uchi and soto' as a key to understanding the Japanese approach to the environment they live in. \n Examples from Japanese art, philosophy, religion and ecology.\n2. 'uchi and soto' as a means of defining the \"in-group\" and the \"out-group\" and justifying them. \n Examples from history and sociology.", ""], "local-88d5e508": ["2025年教育部補助學生出國參加國際性學術技藝能競賽作業要點", "2025-01-17", "教育部補助大學校院學生出國參加國際性學術技藝能競賽作業要點\n中華民國100年04月12日教育部臺高(一)字第1000043852C號令訂定發布  並自中華民國100年02月01日生效中華民國102年05月13日臺教高（四）字第 1020067393C 號令修正發布  第 7 點，並自即日生效中華民國103年01月23日教育部臺教高(四)字第 1020196815B 號令修正  發布名稱及全文11點，並自即日生效(原名稱:教育部補助大學校院學生出  國參加國際性學術技藝能競賽及發明展作業要點)\n中華民國112年4月17日教育部臺教高(一)字第 1122200904A 號令\n修正部分規定，並自即日生效中華民國114年1月17日教育部臺教高(一)字第 1132203784A 號令\n修正部分規定，並自即日生效\n一、目的：教育部（以下簡稱本部）為鼓勵全國大學校院學生出國參加國際性學術、技藝能競賽（以下簡稱國際競賽），拓展國際視野，強化學生專業新知、技藝能發展，特訂定本要點。\n二、申請單位：國內公立及私立大學校院。但不包括科技大學、技術學院及專科學校。\n三、補助範圍：\n（一）本要點補助參加之國際競賽，其參賽組別最近三年參賽國家數，以平均在十國以上為原則。非屬國際性競賽、與高等教育無直接相關，或屬表演賽、邀請賽及觀摩賽等之國際性競賽，不在補助範圍。\n（二）設計類補助之國際競賽種類以本部鼓勵學生參加藝術與設計類國際競賽獎勵要點所定者為限，學校申請不限案數，同一作品不得超過二人，並以一次為限。\n四、補助對象及條件：具中華民國國籍，且於大學校院在學期間，代表學校實際參與國際競賽之學生，並符合下列條件之一者，得予補助：\n（一）具學術、技藝優良表現：學生個人或團體最近二年內在國內外學術、技藝能競賽有優異名次或事蹟表現。\n（二）經國內賽選拔：學生個人或團體參加全國性學術、技藝能競賽獲優異名次。\n五、補助原則：\n（一）本補助以採部分補助為原則，申請學校自籌款比率應達所需出國總經費百分之二十以上。但屬國內賽選拔者，經本部同意，承辦國內賽學校得免提列配合款。\n（二）本補助以不重複補助為原則。申請案件未獲本部其他補助者，得依本要點提出申請。有重複補助情形，應予追繳全部補助經費。對每位學生出國參賽之補助，每年以一次為限。\n（三）補助額度由本部視申請案之可行性、重要性及是否符合政策需要等因素核定之。\n（四）申請案經本部審查核定補助金額後，各校應依核定金額及審核意見，修正申請案再函報本部同意後，始得辦理。\n（五）學校依第七點第一款規定提出申請補助；申請補助學生團體者，同一競賽、同一隊伍至多五人。\n六、補助項目及額度：以補助學生出國參加國際競賽之經濟艙機票費用、實際參賽或領獎日之膳宿費為限，並依國家地區以下列金額為限：\n（一）亞洲地區每人新臺幣一萬八千元。\n（二）美洲、大洋洲及非洲地區每人新臺幣五萬元。\n（三）歐洲地區每人新臺幣六萬元。\n七、申請作業：\n（一）受理時間：符合第四點規定之補助對象者，由學生所屬學校或承辦國內賽學校依本部公告時間，向本部提出下一學期申請補助案，本案申請作業每年以二次為原則。\n（二）學生參加國際性技能競賽，因等候獲獎通知或分階段比賽，致未能依規定於前一學期事前提出申請者，得檢附相關證明文件併同下一學期申請案，依前款公告時間報本部審查。\n（三）申請資料：申請學校應提出下列表件，各一式五份：\n1.申請表。\n2.佐證資料：依第四點各款符合之條件，提出其證明及相關文件影本。\n（四）申請文件以送達本部時間為準；逾時送達、資料不全或資格不符者，不予受理。\n八、審查作業：\n（一）由本部依本要點之補助宗旨、內容規劃完整性、經費編列合理性、執行可行性及預期成果效益等予以審查，必要時，並得邀請專家學者組成專案小組審查。\n（二）審查作業以受理申請截止日起二個月內完成為原則。\n九、經費請撥及結報：\n（一）請撥：經核准受補助者，應於獲本部函知核定補助後一個月內，由學生所屬學校或承辦國內賽學校造冊報本部請撥經費。\n（二）結報：由提案學校於申請補助案執行結束後一個月內，備齊經費收支結算表與成果報告書（包括本案整體實施績效，每一競賽之照片五張以上、作品或照片推廣同意書及學生參賽心得等），送本部辦理結案。\n（三）經費請撥、支用及結報應依本部補（捐）助及委辦經費核撥結報作業要點規定辦理。\n十、補助成效考核：\n（一）申請案經核定後，應依補助案內容執行。未依本部相關規定辦理或未經本部同意自行變更情事者，除應繳回補助款外，應間隔一年後，始得再提出申請案。\n（二）各校得辦理補助案成果發表會及參賽經驗座談會等，以分享執行成果並進行經驗交流。\n（三）本部得視需要，邀請獲獎勵之學生配合參與各項教學推廣及高等教育宣導活動。\n十一、各校得依本要點規定，訂定補助學生出國參加國際競賽活動相關之規定，配合執行之。十一之一、本要點未盡事宜，依相關法令或專案小組審查辦理。\n教育部補助大學校院辦理學生出國參加國際性學術技藝能競賽\n114學年度第2學期申請查核表\n申請學校：\n申請補助者姓名：\n序號\n查核項目\n勾選內容\n一、補助範圍\n1.\n申請參賽組別是否符合最近3年參賽國家數，以平均在10國以上，並已檢附佐證資料。\n□符合\n□不符合\n2.\n參與競賽是否符合屬於國際性競賽並與高等教育直接相關。\n□符合\n□不符合\n3.\n參與競賽是否符合非屬表演賽、邀請賽及觀摩賽等之國際性競賽。\n□符合\n□不符合\n4.\n設計類補助之國際競賽種類是否符合屬於「教育部鼓勵學生參加藝術與設計類國際競賽獎勵要點」所定者，且同一作品未超過2人，並以1次為限。(非設計類免填)\n□符合\n□不符合\n二、補助對象及條件\n5.\n申請補助者是否符合皆具中華民國國籍，且於大學校院在學期間，代表學校實際參與國際競賽之學生。\n□符合\n□不符合\n6.\n申請補助者是否符合下列條件之一者，並已檢附相關佐證資料：\n(1)具學術、技藝優良表現：學生個人或團體最近2年內在國內外學術、技藝能競賽有優異名次或事蹟表現。\n(2)經國內賽選拔：學生個人或團體參加全國性學術、技藝能競賽獲優異名次。\n(參與團體競賽者，亦需檢附個人優良表現資料。)\n□符合\n□不符合\n三、補助原則\n7.\n申請學校自籌款比率是否符合應達所需出國總經費20%以上(但屬國內賽選拔者，經本部同意，承辦國內賽學校得免提列配合款)。\n□符合\n□不符合\n8.\n申請補助者是否符合本年度未獲本計畫補助且未獲本部及相關政府部門補助者。\n□符合\n□不符合\n9.\n申請補助學生團體者是否符合同一競賽、同一隊伍未超過5人。\n□符合\n□不符合\n四、其他\n10.\n申請補助者是否符合屬於參加國際性技能競賽，因等候獲獎通知或分階段比賽，致未能依規定於前一學期事前提出申請者，已提出相關佐證資料(例如：主辦單位正式通知、競賽議程表等)。(非屬本項者免填)\n□符合\n□不符合\n11.\n申請表填寫內容及檢附佐證資料是否皆符合本要點規定，並提供完整資料1式5份。\n□符合\n□不符合\n學生承辦機關長官\n簽章單位或負責人\n填表說明：每案應填1份，項目應確實查核，若經查 深化海外國際化經驗。 \n \n申請資格 \n• 本校修業滿一學期的在學學生(不含碩士在職專班) \n• 自2025年秋學期甄試起，不開放交換中同學申請。 \n• 赴全球姐妹校交換學習期間需具備本校在學身分 \n• 在學期間至境外大學校院研究或修讀課程學分者除修習雙聯學位者外，其餘研修期限均以 \n一年為限。 \n \n相關費用 \n• 赴全球姐妹校交換學習期間，需完成本校註冊與繳納本校全額學雜費(免繳姊妹校學雜費) \n• 交換學生需自行負擔來回機票、簽證費、生活費、書籍費等相關個人支出 \n• 交換學生甄試報名費新台幣伍佰元整；報名費繳交後概不退費 \n• 獲錄取交換學生需繳交學習保證金新台幣壹萬元整；如符合以下任一條件者得申請退還 \n(1) 於姊妹校規定期限前完成所有文件繳交及相關作業程序，但未通過姊妹校審核 \n(2) 因不可抗力或特殊因素無法赴姊妹校交換學習 \n(3) 完成交換學習返國後，依據國際處規定於期限前繳交學習心得報告 \n• 東海大學高等教育深耕計畫得訂定相關補助辦法，鼓勵本校學生赴全球姊妹校交換學習 \n• 具中華民國國籍並在台灣設有戶籍學生得申請教育部學海飛颺與惜珠計畫補助 \n \n \n \n \n\n \n東海大學赴全球姊妹校交換甄試簡章 General Information for Outbound Exchange Application P2 \n \n東海大學國際暨兩岸合作處\n重要日程(節錄) \n2025年2月-3月 \n日期 \n事項 \n備註 \n2月11日(二) \n公告甄選簡章 \n14：00開放網路報名 \n3月10日(一) \n報名(繳費)截止 \n16：00 \n3月12日(三) \n公告口試場次表 \n14：00 \n3月14日(五) \n口試 \n09：00 \n3月19日(三) \n公告選填學校場次(唱名順序) \n14：00 \n3月21日(五) \n選填學校 \n09：00 \n3月28日(五) \n推薦資格確認書截止收件(繳交保證金) \n16：00 \n重要日程 (1) \n2025年2月11日(二)下午14點：國際處首頁「最新消息」公告本甄試簡章 \n2025年3月10日(一)下午16點前：完成網路報名、繳交資料、繳交報名費 \n• 程序一 網路報名 \n網址：https://form2.thu.edu.tw/4257859 \n• 程序二 繳交以下文件至國際處(或報名網頁上傳) \n(1) 名次證明書(開學2周後註課組申請) \n(2) 歷年成績單中文版(開學2周後註課組申請) \n(3) 選繳下列外語能力檢定證明正本與影本(正本驗還) \n• 英語能力檢定：ITP托福、iBT托福、雅思 \n• 日語能力檢定：日本語能力檢定N5至N1 \n• 韓國語文能力測驗：6~2級 \n• 英語檢定、日語能力檢定、及韓國語文能力測驗，請以成績最高者擇一提交 \n• 正本查驗期限：口試當天。口試結束前如無法提供正本查驗則視為無成績或以當時\n最優成績計。 \n(4) 領取繳費單至出納組繳交報名費新台幣500元整(繳費收據學生自存)；報名費繳交後概\n不退費 \n• 完成繳件後不再接受補件、更換文件 \n重要日程 (2) \n2025年3月12日(三)下午14點：國際處首頁「最新消息」公告口試場次表 \n2025年3月14日(五)上午9點起：進行口試 \n 1.依據口試場次表進行團體口試 \n2.團體口試階段、場次、時間及人數依據總申請人數設定 \n3.口試語言為中文；母語非中文同學得以英文進行口試 \n4.請於口試場次開始前15分鐘報到 \n5.口試內容：30秒自我介紹、1分鐘個人抽選題、及開放討論題 \n(1)自我介紹：請於30秒內提示姓名、系級、目標選填學校、個人傑出表現 \n(2)個人抽選題：請於1分鐘內簡要回答全球視野與移動力相關問題 \n(3)開放討論題：可包含個人申請動機、交換學習計畫、人格特質；目標選填學校所在區 \n域的時事分享與討論、其他有利審查表現等議題積極展現赴海外學習的潛力並與口試教 \n師互動 \n6.未參加口試者視同放棄本次甄選。 \n\n \n東海大學赴全球姊妹校交換甄試簡章 General Information for Outbound Exchange Application P3 \n \n東海大學國際暨兩岸合作處\n重要日程 (3) \n2025年3月19日(三)下午2點：國際處首頁公告選填學校場次表 \n• 選填學校場次表依據甄試總成績高低排序，總成績計算評分標準如下： \n1、學業表現(40%)：歷年各學期班排名百分比平均 \n2、團體口試(40%)：由3位跨院教師擔任口試委員，依其成績平均 \n3、外語能力(10%) e University \n35,000 \n45,500 \n56,000 \n\n3 \n \n \n舊金山 \nUniversity of California, Berkeley\n40,000 \n52,000 \n64,000 \n歐\n洲\n英\n國\n倫敦 \nSchool of Oriental and African \nStudies, University of London \n35,000 \n45,500 \n56,000 \nLondon School of Economics and \nPolitical Science \n35,000 \n45,500 \n56,000 \n法\n國\n巴黎 \nSciences Po \n35,000 \n45,500 \n56,000 \n德\n國\n法蘭克福\nUniversity of Tuebingen \n25,000 \n32,500 \n40,000 \n本計畫補助金額參考行政院院授主預字第1110102303B、1110103868 號函修正之「中央政府各\n機關派赴國外各地區出差人員生活費日支數額表」所列日支生活費比例核算。 \n \n伍、申請資格：申請學生必須符合以下各項資格。 \n一、具中華民國國籍，且在臺灣地區設有戶籍。 \n二、學生身分規定（每名學生限擇1 類申請）： \n配合A、B、C 及D 類進修機構，規定如下： \n（一） A 類、B 類：國內公私立大學校院（不含軍警校院）主修或雙主修人文或社會\n科學相關學系大二（含）以上之大學部在學（非應屆畢業）學生（不含五專\n部學生），且未來有志從事人文社會科學領域學術研究者。 \n \n（二） C 類、D 類：符合下列情形之一者 \n1. 112 學年度（含）以後取得國內公私立大學校院（不含軍警校院）學士學\n位，並於115 年4 月30 日前提出115 學年度秋季學期國內公私立大學校\n院（不含軍警校院）人文或社會科學相關研究所碩士班（非碩士在職專班）\n錄取證明者。 \n\n4 \n \n \n2. 114 學年度國內公私立大學校院（不含軍警校院）學士班應屆畢業生，並\n於115 年4 月30 日前提出逕讀博士班錄取證明者。 \n3. 114 學年度就讀國內公私立大學校院（不含軍警校院）人文或社會科學相\n關學系碩士班一年級在學學生（非碩士在職專班）。 \n三、具備相關語言能力證明及其他足以證明本身表現之資料。 \n四、未同時領取政府預算所提供累計逾1 年以上之留學獎補助。 \n五、曾獲本計畫補助者，不得再次申請。 \n \n陸、申請程序： \n一、申請日期：自114 年10 月15 日起至114 年11 月15 日止，逾期不予受理。 \n二、申請方式：應於規定期限內，完成線上申請及資料繳交，網址為https://youconf.at/bunban。 \n \n柒、申請資料： \n應繳交之申請資料包括下列文件： \n一、報名表及聲明書：線上填寫報名表完成後，應下載及列印聲明書（附件一）簽名蓋章\n後上傳。 \n二、自述：以2,000 字為限，內容應包括個人學習經驗、參與學術活動、專題計畫或研究\n經驗、個人傑出表現、至國外機構進修之學習規劃、生涯規劃等。 \n三、個人作品1 件：如學期報告、專題寫作等各類作品（如為共同作者應說明自身貢獻）。 \n四、大學歷年在校成績單及名次證明掃描檔（如曾修習過EMI 課程，請備註並列出）。 \n五、推薦信1 封：由推薦人以公務信箱自行email 至計畫辦公室電子信箱\n（bunban@sinica.edu.tw），或掛號郵寄至計畫辦公室（地址：115201 臺北市南港區\n研究院路二段128 號中央研究院社會學研究所/人文及社會科學學術人才跨國培育計\n畫辦公室收）。推薦人選擇掛號郵寄者，請於信封彌封處簽名。推薦信應於114 年\n11 月15 日前寄達。 \n\n5 \n \n \n六、語言能力證明：申請人應依類別提出下列語言能力證明，並須達到國外進修機構之語\n言能力要求（請至本計畫簽約合作之歐美大學網站查詢），始取得分發資格。如未於\n114 年11 月15 日前提出下列語言能力成績單正本者，A、C 類申請者可先繳交網路\n成績單或已報名考試之證明，最遲應於複試前補交語言能力成績單正本；B、D 類申\n請者因德語及法語考試場次較少，依當年度計畫辦公室公布之考試日期場次為準，並\n繳交已報名考試之證明。 \n（一）A 類、C 類選送學生：應提出TOEFL iBT 總分90（含）以上，或IELTS 總分\n6.5（含）以上之語言能力成績證明。 \n（二）B 類、D 類選送學生：應提出德語或法語任一語言之能力成績證明，德語\nGoethe-Zertifikat 成績B1（含）以上，或TestDaF 第三級（含）以上；法語\nDELF/DALF 或TCF / TCF DAP 成績B2（含）以上。 \n七、身分證及學歷證明：應繳交身分證及學生證正反面掃描檔，C 類及D 類第一、二項\n申請者並應於115 年4 月30 日前，提出115 年秋季學期碩士班（非碩士在職專班）\n或學士逕讀博士班錄取證明，否則自動喪失錄取資格。 \n八、前開文件應於規定期限內繳交，並於複試時繳驗第4、第6、第7 項文件之正本。除\n推薦信外，電子檔限pdf 格式。所送資料概不退還。 \n九、若線上報名繳交資料及推薦信傳寄申請作業中，有任何1 項未完成者，皆視為申請資\n料不齊全，不予受理。 \n \n捌、審查程序：由計畫辦公室組成審查會，經本部核准後，以書面、筆試、會議及面談方式進\n行審查。最終是否錄取仍需經國外進修機構同意。 \n一、初審：審查委員會進行書面資料審查，擇優錄取參加複試。 \n二、複試：預定於114 年12 月上旬舉辦，通過複試者始得參加講習。 \n三、講習：預定於114 年12 月中、下旬舉辦。完成所有講習課程且成績達標準者，始取\n得分發資格。 \n\n6 \n \n \n四、分發：預定於114 年12 月底進行分發，依進修機構名額、審查總成績（初審30%、\n複試30%、講習40%）及學生個人志願分發。 \n五、上開程序之實際辦理日期，以計畫辦公室之通知為準。 \n \n玖、經費請撥及結報： \n一、請撥：選送學生於取得進修國家簽證後，應與本部簽定行政契約書及借支收據（附件\n二），並持下列文件向計畫辦公室請款。 \n（一）選送學校之入學許可 \n（二）護照影本 \n（三）簽證文件影本 \n（四）電子機票及其代收轉付收據 \n（五）選送學生本人之郵局帳戶封面影本 \n（六）財力證明（銀行或郵局的存款證明，核發日期須在出國前6 個月內） \n二、結報：選送學生應於進修期滿返國後1 個月內，向計畫辦公室繳交成果報告書及原始\n憑證辦理核銷。餘依本部補（捐）助及委辦經費核撥結報作業要點規定辦理。 \n \n拾、選送學生應盡事宜： \n選送學生應履行下列規定。未經本部同意，不履行或無法履行者，不予核發經費，已核撥\n經費者，由計畫辦公室報本部追回補助款項： \n一、出國前： \n（一）應參加計畫辦公室舉辦之行前說明會及相關活動。 \n（二）應於規定期限內，前往分發之進修機構。 \n（三）應與本部簽定行政契約書。 \n（四）C 類及D 類學生如為具有役男身分者，應於115 年8 月31 日前完成辦理緩徵。 \n二、出國期間： \n\n7 \n \n \n（一）於進修機構之選課內容，應送經計畫辦公室審核。 \n（二）A 類及C 類選送學生，進修期間所修習之學分數應符合進修機構規定之全時\n學生標準，所有修習之課程成績應達及格標準。B 類及D 類選送學生，第1\n學期得於進修機構選修德語或法語課程，第2 學期修習之學分數應符合進修機\n構規定之全時學生標準，課程成績亦應達及格標準。B 類德語組及D 類選送\n學生一學年至少修習30 學分，扣除德文語言課程學分後，應有超過一半為德\n語授課課程或全年至少有15 學分的課程是德語授課（不含語文課）。B 類法\n語組選送學生一學年至少修習45 學分，扣除法文語言課程學分後，應有超過\n一半為法語授課課程或全年至少有20 學分的課程是法語授課（不含語文課）。 \n（三）選送學生修習科目成績不及格者，應依不及格之學分比例繳還該學期之學費及\n生活費補助，第1 學期修習科目不及格者，取消下學期受補助資格，並應於指\n定期限內結束進修返國。停修比照辦理。 \n（四）選送學生為訪問交換學生身分，於國外進修機構各系所課程是否有修習之資格，\n須依各進修機構規定。 \n（五）選送學生不得變更原錄取之國外進修機構及科系，但國外合作單位與計畫辦公室\n雙方合作計畫有所變動或有特殊情形，經本部同意後始得為之。 \n（六）進修期間，不得有違反學校規定、無故曠課、離校或轉學等情形。經國外進修機\n構通知，或由計畫辦公室主動發現查證屬實者，得由計畫辦公室報請本部廢止其\n資格，並停止補助。 \n（七）應於本部核定之補助期程內修習完畢，不得有提前返國之情形；有特殊或緊急\n事故於進修期間回國者，返國期間所需費用由學生自費負擔，並繳還回國停留\n期間已支領之生活費予本部。返國總日數以30 日為限，逾30 日者，視同放棄\n學業，應償還領取之補助經費。 \n（八）進修期間應配合計畫辦公室辦理修業情形調查並提供資料。 \n三、返國及返國後： \n\n8 \n \n \n（一）應於進修期限屆滿60 日內返回原校就讀，不得申請延期，並於返國1 個月內，\n繳交進修成果報告，其內容應強調國外進修心得及對臺灣文化社會等相關議題\n之反思（同時繳交word 檔及pdf 檔）；另應配合計畫辦公室或學校舉行之推\n廣活動，將國外進修心得與經驗向同儕及學弟妹分享，並配合進行本計畫後續\n追蹤調查。 \n（二）完成返國義務，應填具完成義務期滿申請書（附件三）。 \n \n拾壹、選送學生應注意事項： \n一、入出境許可、護照與進修國家簽證之程序及費用由選送學生自行辦理，因故未能取得\n入出境許可、護照或學生簽證，而無法如期赴國外進修者，自動喪失錄取資格。 \n二、來回機票、進修機構學費及國外生活費等補助經費，由選送學生向計畫辦公室請撥。 \n三、於國外進修機構所修得之學分，由原在臺就讀學校自行決定是否採計抵免。 \n四、所有學生於國外進修期間應保留原就讀學校學籍，不得在臺學校辦理畢業或休學。C\n類及D 類第一、二項學生應於115 年4 月30 日前，提出115 年秋季學期碩士班（非\n碩士在職專班）或學士逕讀博士班錄取證明，否則自動喪失錄取資格。 \n五、具有直轄市、縣（市）主管機關審核通過之低收入戶及中低收入戶身分者，應於申請\n及簽訂行政契約時檢附低收入戶及中低收入戶相關補助證明及戶口名簿影本（註明與\n正本相符並親筆簽名）或本部認可之相關戶內人口證明文件。 \n六、應遵守本計畫要點、甄選簡章、行政契約書、原就讀學校及本部之相關規定。 \n七、其他未盡事宜依本部相關函文、公告及選送學生與本部雙方簽定之行政契約書辦理。 \n\n9 \n \n \n附件一 \n聲明書 \n \n申請日期： 年 月 日 \n \n茲聲明本人 ＿＿＿＿＿＿＿＿ 申請教育部「115 年度人文社會科學學術人才跨國培\n育計畫」檢附之申請文件（包括線上報名表、自述、個人作品1 件、大學歷年在校成\n績單正本及名次證明正本、推薦信1 封、語言能力證明、身分證及學歷證明）電子檔\n與該正本完全相符；本人並聲明願就所提供資料之正確真實性負完全責任，如資料電\n子檔與正本不符或有偽造等不實情事，經查證屬實，自動喪失申請及錄取資格。 \n \n此 致 \n教育部人文及社會科學學術人才跨國培育計畫辦公室 \n \n立聲明書人：＿＿＿＿＿＿＿＿＿（簽名並蓋章） \n身分證字號：＿＿＿＿＿＿＿＿＿ \n \n \n-------------------------以 下 由 收 件 單 位 填 寫---------------------- \n查證日期： 年 月 日 \n查證單位及人員：＿＿＿＿＿＿＿＿ \n資料電子檔與正本查證情形：□相符無誤 □不符(撤銷申請資格) \n\n10 \n \n \n附件二 \n借支收據 \n承辦單位：中央研究院社會學研究所\n茲收到教育部115 年度人文社會科學學術人才跨國培育計畫補助費 \n新臺幣 元整 \n選送學生姓名 \n \n身分證字號 \n \n戶籍地址 \n \n個人帳戶 \n \nE-mail \n \n計畫編號 \n \n核准進修學校(附入學許可) \n \n核定出國期間 \n115 年8 月1 日 至 116 年7 月31 日 \n國外進修機構學費 \n \n來回機票費 \n \n國外生活費 \n \n借支金額合計 \n \n領款人簽章 \n \n日 期 \n115 年 月 日 \n註1：國外進修機構學費採全額補助，惟學費一經核定，即以核定金額為上限，檢據核\n實報支。匯率以繳費當日為準。 \n註2：補助直接或最短航程往返之經濟艙機票，每人以新臺幣60,000 元為上限。 \n註3：國外生活費按核定出國期間內實際停留月數每人每月補助新臺幣 元，每人\n至多補助10 個月，以新臺幣 元為上限。自抵達國外進修機構當日開始計\n算，停留期間不足1 個月者，以每月30 日為基準，按比例計算核發。 \n計畫主持人簽章（選送學生免填）： \n\n11 \n \n \n附件三 \n教育部 \n人文社會科學學術人才跨國培育計畫 \n完成義務期滿申請書 \n 本人 係鈞部115 年度人文社會科學學術人才跨國培育計畫補助之學生，\n性別： ，身分證字號： ，中華民國 年 月 日\n生，於 年 月 日赴 (國家) (學校)\n進修，於 年 月 日返國，自返國行使義務當日起 116 年 月 日(返國\n日期)至 117 年 月 日(返國日期後推1 年)，已完成下列事項： \n1. 繳交成果報告書 \n2. 參加計畫辦公室舉辦之返國學生座談會 \n3. 配合參加計畫辦公室舉辦之成果發表會及甄選說明會 \n4. 配合參加校內舉辦之相關活動： \n□ 學校曾舉辦相關活動，活動名稱： ，日期： 年 月 日。 \n□ 學校未舉辦相關活動。 \n請惠予開立完成義務期滿證明。 \n 此致 \n教育部 \n 申 請 人： （本人簽名並蓋章） \n 聯絡地址： \n 電 話： \n \n中華民國 年 月 日", ""], "local-3c48cb5f": ["2026年第一期日本台灣交流協會獎學金短期留學生申請簡章", "2025-10-07", "1 \n \n2026 年度第一期 日本台灣交流協會獎學金(短期留學生)申請簡章 \n \n \n公益財團法人日本台湾交流協會 \n \n1. 主 旨 \n 本項獎學金是以台灣各大學院校和日本各大學﹑研究所﹑短期大學﹑高等專門學校間簽訂有學生交\n流等相關協議為基礎設立。依據交流等相關協議各大學院校學生赴日本各大學短期交換留學時，公益財\n團法人日本台灣交流協會(以下簡稱本協會)，希望能透過對短期留學學生的資助，拓展日台之間留學生\n交流，提昇雙方教育、研究水準、並以增進互相瞭解及友好親善為目的。 \n 本獎學金之目的為促進台灣以日本作為研究對象以及台灣籍學生於日本進行課程學習、研究，並非\n全然以短期交換留學為主，而是支援以日本為研究對象且已著手於人文、社會科學領域等進行研究，於\n結束短期交換留學後，以在日本的研究內容撰寫畢業論文並取得學位之台灣籍在學學生；於自然科學\n領域以日本為研究對象進行研究，亦或是目前正與日本的大學等研究機關進行共同研究者等，並於結\n束短期交換留學後，將此交換留學經驗活用於台灣方面大學的教育、研究上之台灣籍在學學生。 \n \n2. 對 象(需完全符合①～③項條件，且同時為④或⑤者) \n ① 未滿35 歲。(1991 年4 月2 日以後出生者) \n ② 2025 年9 月1 日起至本獎學金支領期間期滿為止，必須是台灣各大學院校正規課程在學學生。 \n (大學、碩士班以及博士班在學學生皆可申請) \n ③ 留學開始時，修業年限不可超過正規修業年限。(延畢生不可) \n ④ 以人文・社會科學(政治學﹑經濟學﹑經營學﹑法學﹑歷史學﹑文學)等專攻領域之大學、 \n 碩士、博士課程在學學生，已著手以日本為研究對象進行研究(日本政治・外交・經濟政策等國 \n 際問題・法律・歷史等研究)相關計畫，亦或是目前正與日本的大學等研究機關進行共同研究者。 \n 結束日本短期交換留學後，以在日本的研究內容撰寫畢業論文並取得學位者。 \n ⑤ 以自然科學(理工科學、農學、醫學)等專攻領域之大學、碩士、博士課程在學學生，已著手以日 \n 本為研究對象進行研究，亦或是目前正與日本的大學等研究機關進行共同研究等，於結束短期 \n 交換留學後，將此交換留學經驗活用於台灣方面大學的教育、研究上者。 \n \n 3. 申請者資格及條件 \n ① 台灣籍、台灣各大學院校在學學生。(有日本國籍者除外) \n ② 2026 年4 月到2026 年8 月期間內進入日本各學校開始交換留學者。日本各大學等交換校所核 \n 發之核定交換留學證明、入學許可書上的日期必須在此期間內（建議請事先與該大學等交換校 \n 確認）。 \n ③ 留學期間三個月以上不滿一年者。 \n ④ 根據學生交流相關協議，日本交換大學已接受並許可入學者。\n(註1) \n ⑤ 在學學業成績優良，在學學校前一學年度成績評價係數(參閱附件1)達2.3 者。\n(註2) \n ⑥ 日本交換留學結束後，回原就讀學校繼續完成學業，或預定以在日本的研究內容撰寫畢業論文 \n\n2 \n \n 並取得學位者。 \n ⑦ 本獎學金支領期間內，不得重複領取其他政府單位﹑機關團體所提供的任何獎學金。\n(註3) \n ⑧ 2025 年9 月1 日起需居住在台灣。因短期旅行離開台灣者不在此限。 \n ⑨ 若曾為本獎學金合格者，需於前次交換留學回台後滿一年以上方可再次提出申請。 \n \n 註1.申請本獎學金時若未得到日方交換學校的許可者，依「10. 申請所需資料和申請辦法(1) \n ④」之相關規定辦理。若無法於規定期限內提交「入學許可書」影本至本協會者，則將取 \n 消其領取資格或是造成領取時間延後之狀況。 \n 此外，因日台雙方大學簽訂協議，互相採認授課學分，可取得雙方兩校學位之雙聯學位計 \n 畫，非本獎學金申請對象。 \n 註2.無法以成績評價係數評量成績時，請推薦人明確於「10. 申請所需資料和申請辦法(1)③」 \n 個人推薦書〔表格3〕上寫出認為該申請者成績可評為2.3 以上之理由。 \n 碩士班一年級學生，成績以大學四年級全學年度成績核算，但若有留級後才畢業情況者， \n 需以畢業前兩學年度成績合併核算。 \n 註3.包含台灣及日本等所有項目之獎助學金。但補助若為交通費(臺幣三萬元以內)時，不屬於 \n 重複支領規範內。 \n \n 4. 各大學的推薦人數 \n 各校可推薦人數，一份交換學生協議書可推薦5 名學生。 \n \n 5. 申請日程 \n ① 申請開始時間: 2025 年10 月1 日(三) \n ② 申請截止時間: 2025 年11 月5 日(三)【郵戳為憑】 \n 關於申請辦法請參閱「10. 申請所需資料和申請辦法」 \n ③ 「申請編號」通知：2025 年11 月下旬(預定)。 \n ◎「申請編號」會同時以電子郵件通知申請者及推薦學校。 \n ◎ 12 月上旬(12 月5 日以後)若仍未收到「申請號碼」者請來電查詢。恕不答覆「申請編號」 \n 以外之詢問。 \n ④ 結果通知：2026 年2 月下旬(預定) \n 關於結果通知方式，請參閱「12. 結果通知方法」 \n \n 6. 預定錄取人數 \n 7 名 \n ※視甄選審查結果，本協會具有調整錄取人數之權利。 \n \n7. 獎學金內容 \n 獎學金 每個月8 萬日幣 \n ※本獎學金將於實際赴日當月份開始支領。若是於台灣先以線上課程進行交換留學者，該期間之獎 \n 學金則不予支付。 \n\n3 \n \n \n 8. 獎學金支領期間 \n 從留學開始日(入學日)起，最長可支領一年(以內)，本年度獎學金支領期限為2027 年3 月。但如果 \n 留學期間跨年度時，因年度預算之緣故有可能終止獎學金的支付。 \n 日本會計年度為4 月至翌年3 月。 \n \n9. 甄選方式 \n 本協會將根據申請者及推薦學校所提出的資料進行書面審查後甄選出合格者。 \n \n10. 申請所需資料及申請辦法 \n (1) 學生提出資料 \n ① 2026 年度第一期日本台灣交流協會獎學金(短期留學生)申請書〔表格1〕\n(註1) \n ② 就讀大學最近三個月發行最新個人成績證明。 \n Ⅰ. 大學學生，需提出目前就讀學校一年級到目前為止，各學年成績證明。 \n Ⅱ. 碩士班學生，除需提出目前就讀研究所在學期間全部成績證明之外，需再提出最終畢業大 \n 學全學年成績證明。 \n Ⅲ. 博士班學生，除需提出目前就讀研究所在學期間全部成績證明之外，需再提出最終畢業大 \n 學全學年成績證明及碩士班全學年成績證明。 \n ③ 2026 年度第一期日本台灣交流協會獎學金(短期留學生)個人推薦書〔表格3〕\n(註2) \n ④ 日本交換大學院所發行「入學許可書」影本(不接受教授個人同意書或來往電子郵件)\n(註3)。 \n ⑤ 護照影本(①個人資料頁②蓋有出入境章頁) \n 未申請過護照者需附未申請過護照聲明書；持有護照未曾出國者需附出入境證明。(聲明書需 \n 親筆簽名用印，出入境證明資料請至出入境管理局申請) \n ※上述資料正本1 份﹑影本1 份(共2 份)。並依上述順序排列分成正影本各1 份，並於左上角 \n 以長尾夾固定。(切勿使用訂書針裝訂) \n ⑥ 日本研究相關資料\n \n ※ 所有申請者：日本研究相關研究計劃書(日文/英文，A4 紙張3 頁以內) \n(註4) 2 份 \n ※ 申請書〔表格1〕中「8.研究內容之具體成果」為「有」之申請者，相關研究成果\n(註5) 2 份 \n \n 註1. 請注意：所有本協會制式表格請勿任意更改欄位的大小格式及字體。 \n 申請書〔表格1〕請用黑筆書寫，基本資料部份可用中文繕寫，1~7 項欄位請用日文或英 \n 文書寫。內容應詳實字跡工整。請勿擅自放大或縮小本協會表格，亦不得以打字方式提交。 \n 註2. 個人推薦書〔表格3〕可使用中文、日文或英文書寫。但以中文書寫時需另附日文或英文翻譯。 \n ※教授簽章欄位務必請教授親筆簽名並用印。 \n 註3. ①「入學許可書」影本若在申請本獎學金時尚未取得可以於日後取得後提出(並不會影響書 \n 面審查的結果)。但需於2026 年3 月下旬前提交給本協會，故請台灣校方與日本交換大學 \n 協調於提出日前發給「入學許可書」。於期限內無法取得者請務必聯絡本協會。 \n ②請注意，「入學許可書」必須明確記載入學許可期間是自2026 年4 月以後開始，不滿一 \n 年。(但假若新生說明會等於3 月底舉行，實際入學開始日期為4 月以後，則不在此限內。) \n\n4 \n \n 註4. 日本研究相關資料的「研究計畫書」請用規定格式，A4 紙張於四周留白15mm 以上，字體大 \n 小11。參考文獻一覽則不納入規定頁數中)需用日文或英文繕寫。(使用中文者不受理) \n 註5. 相關研究成果請提交大學論文、碩士論文的摘要或是學會、研討會發表資料的大綱，或是研究 \n 成果的作品集等。 \n \n (2) 校方需提出的資料 \n ① 2026 年度第一期日本台灣交流協會獎學金(短期留學生)推薦書〔表格2-1〕〔表格2-2〕(兩表格 \n 之推薦順序務必一致) \n ② 學生交流等相關協議書影本(影印後視正本使用) \n 上述①～②文件正﹑影本各1 份。(正﹑影本請依照推薦順序排列分2 份) \n 校方在確認(1)學生所提出的資料及(2)校方需提出的資料齊全後(〔表格2-1〕必須加蓋學校關防)， \n 於申請截止前以郵寄方式寄至本協會台北事務所新聞文化部。(郵寄地址請參閱「16.資料郵寄地 \n 址﹑詢問聯絡電話」) \n 注意1. 申請時請使用本協會制式表格。請勿擅自更改本協會所有制式表格，格式﹑欄位﹑字體大小。 \n 注意2. 所提出資料一律不予退還。 \n 注意3. 申請方式採郵寄方式，親自送達之申請案件一律不受理。 \n \n11. 申請編號 \n 以電子郵件通知申請者的「申請編號」。12 月上旬(12 月5 日後)，若仍未收到電子郵件者，請來電 \n 查詢。恕不答覆「申請編號」以外之詢問。 \n \n12. 結果通知方式 \n 於本協會台北事務所網站公布合格者「申請編號」，並核發「合格通知」。不合格者不另行通知。 \n 對於推薦學校也會寄送「學生合格與否名單」。合格與否相關詢問一概予不受理。 \n \n13. 獎學金的發給方式 \n 透過日本交換大學發給合格者。 \n ※實際赴日進行交換留學者方得以支領獎學金(線上課程不予以承認)。 \n \n14. 留學狀況報告書的提出 \n 學生於結束交換留學回台後三個月內，需提交「留學狀況報告書」以及系所主任的評語(無制式格 \n 式)給台灣就讀學校負責獎學金之相關單位。 \n 校方在收到學生所提出的報告書後，請函送郵寄至本協會台北事務所新聞文化部。 \n \n15. 放棄合格資格時 \n 合格名單公佈後，因個人因素放棄本獎學金時，請校方填寫「日本台灣交流協會獎學金(短期留學生) \n 放棄合格資格聲明書」(蓋學校關防及校長章)〔表格4〕及附上學生所提出的放棄理由書後郵寄至本協 \n 會台北事務所新聞文化部。 \n \n\n5 \n \n16. 資料郵寄地址﹑詢問聯絡電話 \n 公益財團法人日本台灣交流協會 台北事務所 新聞文化部 短期獎學金承辦人 \n 10547 台北市松山區慶城街28 號 通泰商業大樓 \n TEL: 02-2713-8000 (內線 2411) \n FAX: 02-2713-0541 \n E-mail: shogakukintaipei-k1@tp.koryu.or.jp \n \n17. 其他 \n 於本協會東京本部舉行會議、委員會等時，有可能要求本獎學金合格者發表研究內容、成果。 \n 屆時請遵從東京本部指示進行。 \n \n 本獎學金簡章及各制式表格等，可上協會台北事務所網站下載 \n http://www.koryu.or.jp/taipei-tw/ez3_contents.nsf/Top", ""], "local-8eded750": ["2026年日本國際交流基金會經費資助計畫", "2025-10-14", "1/3 \n 2025 年10 月 \n \n \n2026 年度日本國際交流基金會(The Japan Foundation)經費資助計畫 \n \n \n日本國際交流基金會(The Japan Foundation)經費資助計畫是以公開招募方式，\n在文化藝術交流、海外日語教育、海外日本研究及國際對話等三個領域，針對計\n劃從事國際交流活動之個人或團體提供經費資助或各項研習機會的制度。 \n \n2026 年度日本國際交流基金會(The Japan Foundation)經費資助計畫之申請指南\n現已公告在日本國際交流基金會網頁(細節請見說明2)，有意申請者請詳閱並確認\n申請資格。若有不明之處，請聯絡業務承辦人員(請見說明4)。 \n \n \n \n說 明： \n \n１. 經費資助項目一覽表 (台灣) \n \n申請項目名稱 \n申請內容概要 \n備註 \n \nⅠ文化藝術交流 \n１. 海外展經費資助 \n針對美術館・博物館所舉辦介\n紹日本美術‧文化的展覽，包\n括介紹日本作家‧作品的國\n際展，資助部分經費。 \n申請資格僅限海外的美術館・博物\n館等機構。 \n２. 翻譯・出版經費\n資助 \n鼓勵翻譯‧出版日本書籍， \n針對以促進日本理解為目的，\n從事日語圖書翻譯・出版的海\n外出版社，資助部分經費。 \n申請資格僅限海外的出版社。 \n \n \n \n \n \nⅡ海外日語教育 \n1. 海外日語教育機\n構支援（經費資助） \n \n針對海外日語教育機構或團\n體所實施，為推廣日語或發展\n日語教育所必須的活動，資助\n部分經費。 \n申請資格必須是海外日語教育機\n構・組織（包括日語教師會、學會）。 \n \n \n\n \n2/3 \n \n2. 【訪日研習】海\n外日語教師基礎\n研習 \n \n針對日語教學經驗較少的年\n輕外籍日語教師，提供約六個\n月以提升日語運用能力、日語\n教學法的基礎知識、並加深對\n日理解為目的之研習。 \n研習期間預定為2026 年9 月1 日至\n2027 年2 月25 日。 \n申請者須有日本語能力測驗N4 以上\n程度。 \n3. 【訪日研習】海\n外日語教師日語\n研習 \n以提升日語教師必要之日語\n運用能力為目的，提供約七週\n的研習。課程內容不含日語教\n授法。 \n研習期間預定為2026 年6 月2 日至7\n月23 日。 \n僅限日本語能力測驗N5、N4 程度(不\n含N3 以上)者申請。 \n \n4. 【訪日研習】海\n外日語教師教授\n法研習(夏期‧冬\n期) \n針對具有一定教學經驗的外\n籍日語教師，提供約六週以提\n升日語教授能力為目的之研\n習。 \n夏期預定：2026 年7 月14 日至8 月\n27 日。 \n冬期預定：2027 年1 月19 日至3 月4\n日。 \n申請者須有日本語能力測驗N3 以上\n程度。 \n5. 【訪日研習】專\n業日語研習（文\n化・學術專家） \n為支援需要日語能力的專業\n人士(研究人員、研究生、圖書\n館員、博物館・美術館人員等)\n順利進行專業工作及研究活\n動，提供考量了各專業工作特\n徵的日語能力研習。 \n申請資格僅限從事需要日語能力的專\n業工作者或研究活動者。 \n \nⅢ海外日本研究及國際對話 \n1. 日本研究招聘\n活動 \n為振興海外地區之日本研究，\n針對從事日本相關調查研究\n的學者・研究者及博士論文執\n筆者，提供赴日進行最長12\n個月的調查研究等活動的機\n會。 \n「學者‧研究者(長期)」及「博士論文\n執筆者」可申請。 \n2. 日本研究計畫\n經費資助 \n \n \n為振興海外地區之日本研\n究，針對海外之非營利團體所\n舉辦的日本研究相關各項計\n畫，資助其部分經費。 \n以2026 年4 月1 日至2027 年3 月31\n日期間的支出費用為對象。 \n \n※申請書提交期限一律為2025 年12 月2 日(二)13:00 (日本時間) \n \n２. 簡章 \n \n申請手續、申請資格以及注意事項，請利用以下網頁確認。 \n \n日語 \n \n \n \n英語 \n \n \n \n\n \n3/3 \n３. 注意事項 \n \n(1)不同項目之申請資格及條件均有所不同，請確實詳閱欲申請項目之簡章。 \n(2)申請書請用英文或日文填寫，以中文填寫將不予受理｡ \n(3)本經費資助計畫是以全世界之申請者為對象，將由國際交流基金統一審查後決 \n定是否錄取。 \n \n４. 各項經費資助申請業務洽詢 \n \n日本台灣交流協會台北事務所 新聞文化部 TEL: 02-2713-8000（代表號） \n●文化藝術交流 ： 郭小姐 (分機2410) \n●日語教育 ： 簡小姐 (分機2413) \n●日本研究・學術交流： 陳小姐 (分機2412)", ""], "local-12d1e1a3": ["2026年ICU國際日本暑期課程ISPJ", "2025-10-30", "Communicative\ninteractive \ntask-based \nfor \nPre-Intermediate/\nIntermediate\nlearners\nStudy Japan from\nMultiple\nPerspectives with \na focus on the 2026\nprogram theme\nOn-Campus\nhousing,\nliving alongside ICU\nstudents,\ncultural activities\nincorporated\nJuly 3–July 30, 2026\nApplication deadline March 1, 2026\nICU International \nSummer Program in Japan \nJapanese\nLanguage \nJapan\nStudies\n…and\nmuch more !!\nFind out\nMore\nicu_iee\nTokyo,\nJapan\nCurriculum: Approx.89 hours, 5 credits-worth\n(Approx.47.5 hours are Japanese language classes)\nCompleted \nCEFR A2.1 level \nis a minimum requirement \nby the time the program starts\n\nJSM\nFEATURES\nJapan Studies Module\nFEATURES\nCenter for Global Education\nJapanese Language Module\nStudents explore a variety of Japanese Culture\nPrograms: Examples from 2025 including\nPre-Intermediate/ Intermediate Japanese Program\nDeepening Japanese cultural understanding\nA special Japanese Language Grammar course \nexclusively for Pre-Intermediate students (600 min total)\nEXPAND YOUR WORLD \nIN JAPANESE (ELECTIVES)\nStudents learn Japanese \nfor academic purposes through \nvarious familiar topics about society and culture \nLEARN JAPANESE LANGUAGE THROUGH\nEXPERIENCING JAPANESE CULTURES\nTASK-BASED LEARNING\nPRE-INTERMEDIATE/ \nINTERMEDIATE JAPANESE PROGRAM \n(THREE LEVELS)\nDiverse courses taught by ICU faculty\nStudent-centered approach with lectures, discussions, \nfieldwork and presentations\nStudying together with ICU students\nhttps://sites.google.com/info.icu.ac.jp/icu-ispj/home\nispj@icu.ac.jp\n3-10-2 Osawa, Mitaka, Tokyo 181-8585, JAPAN\nCITY（都市）\nIt is estimated that approximately 85% of the world's population will live in cities by 2100. Japan has already\nexceeded this share, as almost 92% of the population in Japan lives in cities. The Tokyo Metropolitan Area is\nthe largest in the world. However, Japanese cities used to look quite different in the past. \n2026 PROGRAM THEME \nJLM\nJapanese Calligraphy\nJapanese Martial Art (Aikido)\nVoice Acting\nKanji Art\nHaiku\nJapanese Eco-Bags (Furoshiki), etc\nThink and talk in Japanese 1\n　　 (Pre-intermediate level: CEFR A2.2)\nThink and talk in Japanese 2\n (Lower intermediate level: CEFR B1.1)\nThink and talk in Japanese 3\n　　(Intermediate level: CEFR B1.2)\nThe focus of this program is the city and urbanization from a variety of perspectives:\n1. Sociocultural aspects\nExamples from literature, history, and psychology in the way the city is portrayed in literature, how the\nevolution of cities like Yokohama contributed to Japan as we know it, and what urbanization means from a\npsychological perspective.\n2. Environmental, technological, and political aspects\nExamples from Japanese architecture and environmental studies (how big cities like Tokyo tackle pollution\nand biodiversity loss, what kind of environmental issues remain, and how Japan is coping with them).", ""], "local-9b1a7ede": ["2026年Young飛全球行動計畫培訓營簡章", "2025-10-30", "1 \n \n教育部青年發展署 \n115 年Young 飛全球行動計畫培訓營簡章 \n \n一、 目的：教育部青年發展署（下稱本署）以聯合國「永續發展目標（SDGs）」\n為主軸探討社會議題，並採授課分享及提案模擬演練方式，提升設計思考、\n發掘需求及聚焦問題能力，培力青年發展社會創新方案進而組隊提案申請\n本計畫，於北區、北東區及南區共辦理3 場培訓營。 \n二、 主辦機關：教育部青年發展署 \n三、 報名期間：114 年11 月1 日（六）中午12 時至12 月1 日（一）中午12 時\n止。 \n四、 培訓場次 \n場次 \n正取名額 \n115 年∕時間 \n地點 \n北區 \n160 人 \n1/12（一）-1/13（二） \n臺北凱達大飯店3F 宴會廳II \n（臺北市萬華區艋舺大道167 號） \n北東區 \n120 人 \n1/19（一）-1/20（二） \n凱渡廣場酒店1F 凱渡A 廳 \n（宜蘭縣頭城鎮烏石港路300 號） \n南區 \n120 人 \n1/26（一）-1/27（二） \n高雄翰品酒店4F 兆慶廳 \n（高雄市鹽埕區大仁路43 號） \n五、 報名對象：18-35 歲（79 年1 月1 日至97 年12 月31 日間出生者）具中華\n民國國籍之青年。 \n六、 報名方式 \n(一) 步驟一線上報名：於報名期間截止前至本署iYouth 青年國際圓夢平臺\n進行報名（網址：https://reurl.cc/ZNDpxl），填寫並上傳以下資料： \n1. 報名表：線上填寫（資料內容參見附件1）。組團報名請於報名類別\n勾選「團隊報名」（團員人數3-6 人），並提供團隊名稱，每位團員\n仍須個別填寫報名表，並選擇同一培訓場次。 \n2. 身分證明文件：請擇一上傳身分證正面、健保卡或駕照等可供辨識\n身分之證件影本。 \n3. 個人資料使用授權同意書：閱讀及填寫後上傳。（附件2） \n4. 特殊身分證明文件（如有請上傳電子掃描檔）： \n\n2 \n \n(1) 經濟弱勢家庭（中低收入戶或低收入戶）青年：須檢附證明文件\n影本。 \n(2) 原住民族青年：須檢附具有原住民身分之戶籍謄本影本。 \n(3) 新住民（子女）青年：須檢附戶籍謄本影本（以戶政事務所提供\n「記事不省略」之戶籍謄本或新式戶口名簿為主，如：有註記本\n人或父母已結婚登記並載明本人或父母一方外籍配偶之原生國\n籍）。 \n(二) 步驟二線上課程學習：至本署超牆青年E 學院完成「115 年Young 飛\n全球行動計畫培訓營線上課程」（網址：https://reurl.cc/9nM2Kn），並\n於114 年12 月1 日（一）中午12 時前完成下載（網站使用教學參見\n附件3）及上傳課程學習時數證明至iYouth 報名網站。須完成下列3\n堂課程： \n1. 行動方案設計概念介紹 \n2. Young 飛SDGs 永續發展內涵 \n3. 學長姐的提案經驗：109 年團隊Edgier Tableware/Refugee \nNetwork Taiwan 分享影片（2 擇1） \n(三) 步驟三填覆表單及繳納保證金 \n1. 培訓營全程免費，惟須繳交新臺幣（以下同）300 元保證金。 \n2. 於114 年12 月中旬公告正備取名單後，由工作小組以電子郵件及\n簡訊通知正取者保證金繳納之期限、方式及確認表單填寫資訊，若\n正取者未於期限內繳納保證金及填覆表單，視為放棄資格，並接續\n通知備取者，依序遞補至名額額滿為止，請備取者靜候通知。 \n3. 完成保證金繳納及表單填覆，即代表報名完成；各培訓場次辦理前\n5 個工作日之內表示無法參訓者，恕不予退還保證金。 \n4. 若為經濟弱勢家庭（中低收入戶或低收入戶）青年，免繳保證金。 \n \n \n\n3 \n \n(四) 報名期程 \n期間 \n階段 \n說明 \n即日起至 \n12/1（一） \n中午12 時前 \n培訓營 \n報名 \n請於12/1（一）中午12 時前完成線上報名及上\n傳課程學習時數證明；單場額滿或報名截止，系\n統將會關閉。 \n1.請點選下方網址填寫報名表並上傳資料：\nhttps://reurl.cc/ZNDpxl \n2.請點選下方網址完成線上課程，並下載及上傳\n課程學習時數證明至iYouth 報名網站： \nhttps://reurl.cc/9nM2Kn \n12 月中旬 \n正備取 \n名單公告 \n公告於本署官網及iYouth 青年國際圓夢平臺。 \n公告後5 日內\n或通知期限內 \n保證金 \n繳納 \n正取者於公告5 日內(備取者於接獲通知期限\n內)，繳納保證金300 元，並填覆表單確認參加。 \n報名完成 \n七、 審查方式及錄取公告 \n(一) 審查方式：先由工作小組審查報名資料之完備性，資料若有缺漏則不予\n受理，續由本署核定審查結果。 \n(二) 審查標準 \n1. 有意願組隊提案申請「115 年Young 飛全球行動計畫」。 \n2. 完成線上報名順序。 \n(三) 錄取公告：錄取名單預計於114 年12 月中旬，公告於本署官網及iYouth\n青年國際圓夢平臺。 \n八、 培訓課程 \n(一) 線上課程（詳見第六點報名方式之步驟二線上課程學習） \n1. 行動方案設計概念介紹 \n2. Young 飛SDGs 永續發展內涵 \n3. 學長姐的提案經驗：109 年團隊Edgier Tableware/Refugee \nNetwork Taiwan 分享影片（2 擇1） \n(二) 實體課程（培訓營課程） \n\n4 \n \n1. 社會創新的第一步—發掘需求及聚焦問題：引導學員運用社會創新\n及設計思考的核心概念，逐步發掘社會需求、聚焦社會問題，為學\n員後續提案及行動設計做準備。 \n2. 學長姐提案經驗分享：邀請2 位學長姐分享Young 飛計畫提案申請\n及參與經驗，包含團隊組成介紹、行動方案發想及聚焦、國際組織\n搜尋及挑選、在地議題行動規劃及成果等、收穫成長與未來方向。 \n3. 提案指導、方案發表及研討：由Mentor 分組帶領青年團隊研擬及討\n論提案，以設計思考方式引導學員設計規劃行動方案，進行提案簡\n報，並邀請Mentor 給予團隊建議及回饋。 \n九、 培訓完成作業 \n(一) 發放培訓證明書：學員完成培訓者發放培訓證明書乙張（請假須經本署\n同意，請假時數逾1 小時者不予發放），並取得「115 年Young 飛全球行\n動計畫」組隊提案申請資格，詳情請參閱申請簡章。 \n(二) 退還保證金：學員完成培訓者將於培訓營結束當天現場發還（簽立收據）\n保證金，請假時數逾1 小時者，除因不可抗力因素經本署確認外，不退\n還保證金。 \n十、 注意事項 \n(一) 培訓營為2 天1 夜，本署提供1 日住宿（2 人一室、男女分房）、培訓營\n期間膳食、保險（旅遊平安險及公共意外責任險）及指定地點接駁服務\n（於行前通知說明接駁地點）。 \n(二) 參加培訓營請自行選擇合宜時間，本署不出具任何形式之請假證明文件。 \n(三) 本署對本簡章規定保有調整及最終解釋權，本培訓營倘因不可抗力因素\n無法辦理時，本署有權取消、延期或暫停相關活動。 \n十一、 若有相關疑問請逕洽工作小組，電話：（02）7723-0826 分機1010 梁小姐；\ne-mail：youngfly@ydayoungfly.info。 \n \n \n\n5 \n \n \n教育部青年發展署「Young 飛全球行動計畫」培訓營報名表 \n姓名 \n \n英文 \n姓名 \n參加場次 \n□北區 □北東區 □南區 \n備選場次 \n□北區 □北東區 □南區 \n出生 \n（西元） 年 月 日 \n聯絡方式 \n（宅）： （手機）： \nE-mail： \n性別 \n□男 □女 □其他 \n身分證字號 \n \n專長 \n \n就讀學校/服務單位 \n \n科系/職位 \n年級/年資 \n \n身分別 \n□已畢業-社青□仍在學-學青 \n緊急聯絡人 \n \n關係 \n \n緊急聯絡人電話 \n \n通訊地址 \n□□□ 縣市 區市鄉鎮 村里 鄰 路街 \n 段 巷 弄 號之 樓 室 \n特殊身分青年 \n□中低收入戶 □低收入戶 \n□原住民族 □新住民（子女） \n用餐情形 \n□葷 □素 \n報名類別 \n□個人報名 \n□團隊報名/團隊名稱：_________________ \n團員姓名（含自己）： \n （選擇同一培訓場次） \n聯合國17項永續發展目標\n（SDGs） \n（請勾選3項） \n□終結貧窮 □消除飢餓 □健康與福祉 □優質教育 □性別平權 \n□淨水及衛生 □可負擔的潔淨能源 □合適的工作及經濟成長 \n□工業化、創新及基礎建設 □減少不平等 □永續城鄉 \n□責任消費 美元獎學金，共補助2 年。受獎學生仍須於\n不同歐盟國家內的大學，選擇2 所以上大學修課。教育部歐盟獎學金申請\n \n 時間\n \n \n為每年\n \n 6 月份\n \n ( 向教育部申請\n \n ) \n請同學及早準備:\n115 年新伊拉斯莫斯聯合碩士學程 (申請期限:114 年10 月至115 年1 月)\n115 年6 月申請教育部歐盟獎學金\n本次線上座談會主要是幫助有興趣的同學瞭解未來到歐洲進修歐盟聯合碩士學\n程及各類教育部獎學金之機會，還有獎學金生之經驗分享，機會難得，不要錯\n過哦。\n會議流程：\n17:00-17:05 駐歐盟兼駐比利時代表處教育組李彥儀組長致詞\n17:05-17:30 歐盟文教總署政策官Johanna Mansson-Delerce 介紹歐盟新伊拉\n 斯計畫、聯合碩士學程及獎學金\n\n17:30-17:55 駐歐盟兼駐比利時代表處教育組林雅婷秘書\n 簡介教育部歐盟獎學金、與世界百大合作設置獎學金:臺灣-荷語\n 魯汶大學獎學金、臺灣-鹿特丹伊拉斯莫斯大學獎學金以及教育部\n 留學獎學金\n17:55-18:20 教育部獎學金申請及求學經驗分享\n18:20-18:30 Q & A\n報名網址：https://forms.gle/i6hKJigAqu8KaSgu9\n報名截止日期：114 年11 月21 日\n報名後將由本組另行提供線上座談會連結網址。\n期待您的參與！\n聯絡人：駐歐盟兼駐比利時代表處教育組\nE-mail：belgium@mail.moe.gov.tw", ""], "local-882dfdbf": ["2025年立命館大學Ritsumeikan-Data-Science-Program", "2025-11-18", "2025 Ritsumeikan Data Science Program (RDSP) \nNovember 18, 2025 \nStudy Abroad Center \nRitsumeikan University \n【Program Contents】 \n \nLecture \nStudents’ Event \nBUDDY \nRDSP \n570 min *1 \n190 min *2 \nIn groups \n*1： 95 min x 6 = 570 min / *2： 95 min x 2 = 190 min \n \nThe program offers lectures in science and technology fields such as AI, big data, and \nrobotics. \n \nParticipants will also take part in joint classes and workshops with Ritsumeikan University \nstudents. \n \nDetailed lecture titles and topics will be announced once they are confirmed. Please note \nthat the schedule may change depending on the instructors’ availability. \n \n【Eligibilities】 \n \nMust be enrolled in an undergraduate, graduate, or PhD program during the entire program \nperiod. \n \nSubmit all required documents by the due date. \n \nPay the fees by the due date. \n \n【Process Schedule】 \nSchedule \n2025 RDSP \nProgram Starts \nMon, 2025/12/15 \nProgram Ends \nFri, 2025/12/19 \n \n【Program Fees】A service fee of JPY 5,000 will be added. \n \nProgram Fee \nRemarks \nRDSP \nJPY 120,000 \nResidential facility fee: included \n \n【On-Campus Student residence】OIC Seminar House \n \nRDSP \nArrival date \nSunday, December 14, 2025 \n Time frame \n3:00 p.m. – 10:00 p.m. \nDeparture date \nSaturday, December 20, 2025 \n Time frame \n8:00 a.m. – 10:00 a.m. \nUsage Fee \nIncluded \n\nOIC Seminar House is not a hotel but one of Ritsumeikan University’s research and \neducational residential facility. Students must follow the facility regulations and adhere to the \ndesignated schedule. Failure to comply will result in loss of access. Arrival and departure dates \nand time frames are fixed. \n \nLocation: The OIC Seminar House is located on the Osaka Ibaraki Campus (OIC). \nStudents will reside in gender-segregated rooms, with up to four people per room, two bunk-\nbeds. \n• \nRoom assignments are determined by Ritsumeikan University and cannot be changed. \n• \nShared restrooms and shared shower rooms. \n• \nFacility use at OIC Seminar House will be assigned in the order of complete submission \nof all required documents. \n• \nRequired documents include a valid passport. \n• \nAdvance reservations are not available. \n \n【Program Fees included】 \n \nLectures by Ritsumeikan Faculty members and workshops (students’ events) with \nRitsumeikan students. \n \nTaught in English. \n \nAccess to campus Wi-Fi and a library membership card. \n \nNotification of Acceptance Letter, Completion Certificate. \n \nSupport documents for a short-term stay visa to Japan (if applicable). \n \nTravel insurance. \n \n【Program Fees not included】 \n \nRound-trip travel expenses (such as airfare) \n \nLocal transportation fees in Japan. \n \nMeals. \n \nCosts related to obtaining a passport, and short-term stay visa (not a student visa). \n \nOther personal expenses. \n \nNo transcript is issued. \n \nNo scholarships, waivers, or partner discounts are available for this program. \n \nCredits: This program does not grant academic credits from Ritsumeikan University. \n \n【Note】 \nParticipants must attend the program from the first to the final day, including the completion \nceremony. No late arrivals, early departures, or program withdrawals are allowed. Attendance at \nall classes and activities is mandatory. Failure to follow the program rules may result in removal \nfrom the program or restricted access to facilities. To receive a completion certificate, students \n\nmust attend at least two-thirds of all classes. The program requires a minimum of 15 and accepts \nup to 40 participants. \n \n【Sample Schedule】 Subject to change \n \n【OIC】 \n2-150 Iwakura-cho, Ibaraki, \nOsaka 567-8570 JAPAN \n \n【Inquiries】 \nStudy Abroad Center \nRitsumeikan University \nMail: rsjprwjp@st.ritsumei.ac.jp \nTel: +81-75-466-3009 \n \nSun, Dec 14 \nMon Dec 15 \nTue, Dec 16 \nWed, Dec 17 \nThu, Dec 18 \nFri, Dec 19 \nCampus \nOIC \nOIC \nOIC \nOIC \nBKC \nOIC \n10:45-12:20 \nCheck in at \nOIC Seminar \nhouse on your \nown \nOrientation \nCampus tour \nLecture \nLecture \nLecture \nLecture \n13:10-14:45 \nLecture \n \n \nLecture \nCompletion \nCeremony \n17:00- \n \n \nStudent event \nTea Ceremony \nStudent event \nField Hockey", ""], "local-97f1eed4": ["2025年長期交換計畫甄選辦法重大更新通知", "2025-11-21", "No. 1727, Sec. 4, Tel: 886-4-2359-0356 \nTaiwan Boulevard, Fax: 886-4-2359-0884 \nTaichung City, E-mail: oir@thu.edu.tw \n407224, Taiwan www.oir.thu.edu.tw \n \n長期交換計畫甄選辦法重大更新通知 \n國際處為選送學生赴外研修，制定「東海大學赴全球姊妹校交換甄試簡章」，每學期辦\n理長期交換計畫甄選，據以甄選學生錄取資格及選取學校先後順序。 \n本處對甄選辦法不定期、視實際情況進行修訂，近日有鑑於歷屆口試委員對本甄選制\n度的建議，以及歷年各項評分項目(成績)對甄試總成績的影響，國際處於本(114)年11 月\n18 日召開會議進行通盤檢討改善並做出決議。 \n由於修改幅度甚大，為讓在學期間計畫赴外交流研習學生能提早準備，本處決定先行\n公告修改內容，並於114-2(2026 年秋季)學期納入交換甄試簡章開始實施。 \n以下僅就修正部分：評分項目、申請資格修正結果說明 \n(一) 評分項目及錄取資格(依占比高低排序，總分同分比序同)： \n1. 歷年學期班排名百分比平均(30%) \n2. 外語能力(30%) 語檢種類及評分標準如下表；申請兩岸地區交換同學\n該項目一律不計分 \n3. 歷年學期GPA 平均(20%) \n4. 優良表現：新增項目，現階段在學期間參與國際化交流活動證明，占20%，\n其採計項目為： \n(1) 參與中央機構(教育部、外交部、僑委會等)國際交流活動 (20 分) \n(2) 參與國際處或地方政府所辦之國際交流活動 (15 分) \n(3) 擔任本校國際處國際接待志工 (10 分) \n(4) 參與本校院系國際交流活動 (8 分) \n(5) 以上皆以現在學階段為限，並須出具主辦單位所發證明 \n5. 完成(通過)本校基本勞作教育，每期加2.5 分，至多加權5 分 \nOffice of International Relations \n \n \nTunghai University \n\n6. 甄試總成績錄取門檻：新增；全球組暨港澳地區GPA2.5(含)以上；大陸\n組2.0(含)以上 \n(二) 報名長期交換甄選資格 \n1. 開放當學期在外校研修、交換同學仍可報名參加長期交換甄試。 \n \n附表 \n依據外語能力檢定證明計分表 \n \nMinimum Score by \nLevel \nTOEFL ITP TOEFL iBT \nIELTS \nCEFR \n歐語檢定 \nJLPT \nTOPIK \nLevel A (30%) \n677 \n120 \n9.0 \n \nJLPT滿分 \nTOIK滿分 \nLevel B(25%) \n657 \n114 \n8.0-8.5 \nC2 \nN 1 \n6級 \nLevel C(20%) \n627 \n95 \n7.0-7.9 \nC1 \nN 2 \n5級 \nLevel D(18%) \n585 \n84 \n6.5-6.9 \nB2 \n- \n4級 \nLevel E(15%) \n543 \n72 \n6.0-6.4 \nB1 \nN 3 \n3級 \nLevel F(8%) \n430 \n42 \n5.0-5.9 \n- \nN 4 \n2級 \nLevel G(4%) \n- \n- \n- \n- \nN 5 \n1級", ""], "local-615db7d0": ["2026年教育部赴捷克高等教育機構短期進修研究獎學金甄選簡章", "2026-01-20", "1 \n教育部115 年赴捷克高等教育機構短期進修/研究獎學金甄選簡章 \n一、提供單位 捷克教育、青年及體育部 \n二、依據 \n捷克經濟文化辦事處114 年12 月5 日1829-2 號函、駐捷克代表處115 年1 月\n6 日捷克字第11542200030 號函 \n三、名額 \n20 名為期10 個月獎學金(計200 個月)： \n(一)其中 20 個月經捷克教育、青年及體育部(以下簡稱捷克教育部)保留予國\n立政治大學之捷克研究學生，由捷克經濟文化辦事處(CECO，以下簡稱「捷\n駐處」)及該校共同遴選。 \n(二)另180 個月由教育部(以下簡稱本部)與捷駐處合作遴選。其中90 個月可核\n給為期5 個月之申請。 \n四、待遇 \n免學費；具有碩士學位或同等學歷者，每月核予13,000 克朗，未具碩士學位\n或同等學歷者，每月核予12,000 克朗，由受獎者之進修/研究系所發給。亦可\n自費申請學生宿舍，惟須於申請表上註明。另在捷克研習期間之健康保險費用\n須自行負擔。 \n五、受獎期間 115 年9 月或10 月(視擬進修/研究機構之開課表而定)起赴捷克高等教育機構\n進行5 個月或10 個月之進修/研究。 \n六、申請資格 \n \n \n \n \n(一) 具中華民國國籍。 \n(二) 在校任一學期捷克語或英語成績80 分以上或通過「各項英檢與CEFR 架\n構對照表」B2 級列之任一項測驗級/分數以上者。大學英語免修或全英語\n授課科目(EMI)成績80 分以上者，應檢具相關佐證文件並經就讀學校審核\n具備前述語言能力。 \n(三) 須為我國大專校院在學生，即將於115 年取得學士學位或同等學歷者為\n佳，現為大學二年級及三年級生亦可提出申請。 \n(四) 經就讀學校向本部推薦，未經推薦程序之個別申請案，不予受理；已在捷\n克就讀之學生亦由原就讀之國內大學推薦(學校推薦前，請先確認及評估\n申請者赴捷克之可行性，包括個人、家庭及役齡男性兵役問題等因素)。 \n七、參加甄選\n應繳文件 \n(一) 由申請者就讀學校檢附下列資料1 份隨函送部(請依序排列)： \n1.甄選報名表； \n2.捷克語或英語語文成績證明； \n3.獎學金申請表(需進入捷克教育部網站下載檔案繕打，僅簽名部分可手\n寫，務必親筆簽名。申請者應於申請表中敘明所欲進修/研究之學校系\n所及領域，該系所領域需與申請者畢業或就讀之大學系所領域相符，建\n議申請2 個學校系所，於申請表中敘明優先排序。電子郵件及郵寄地址\n務必正確，以供捷克教育部通知核定結果)； \n4.擬進修/研究機構之入學許可或邀請函影本(係重點審核項目，建議檢\n附；倘申請表已勾選檢附，務必併附以茲證明；若無，申請表切勿勾選)； \n5.個人簡歷(至多限A4 兩面篇幅)； \n6.發表著作清單(倘有)； \n7.讀書/研究計畫(係重點審核項目，請於A4 兩面篇幅以內詳述擬就讀之院\n校、研究領域及目標，研究領域需與申請人畢業或就讀之大學系所領域\n相符)； \n8.推薦函2 封； \n9.大學以上最高學位證書影本(倘有)； \n\n2 \n10.在校各學年學業成績單影本； \n11.護照影本。 \n(二) 上述文件編號2 至編號10 請以捷克語或英語撰寫。 \n八、甄選方式 (一) 校內初選：即日起申請者向就讀學校提出申請；學校審核後擇優至多推薦\n5 名，於115 年2 月23 日前函送申請者報名資料審核表及第七點所列應\n繳文件至本部，並以pdf 檔傳送至本部國際及兩岸教育司海外留學科電子\n信箱：dice3@mail.moe.gov.tw。請務必確認紙本文件及電子檔於截止時間\n前送達本部，逾期恕不受理。報名後不得要求補件、抽換資料或更改志願。 \n(二) 國內複選： \n1.書面審查：經本部審查後，函復推薦學校審查結果，並由推薦學校轉知\n資格合格者面試通知單。 \n2.面試日期及方式：115 年3 月7 日及3 月8 日。由捷駐處、本部聘請之\n面試委員對符合申請資格者進行面試，擇優錄取；面試原則以英語、捷\n克語進行。採遠距線上面試。(實際面試時間將另行通知)。 \n3.面試評審標準(總分100 分)： \n(1)書面資料：包括擬進修/研究機構之入學許可或邀請函、在捷克讀書計 \n畫、在校學業成績、個人經歷與傑出表現、自傳等，占25 分。 \n(2)人品與態度：包括儀表、禮貌、態度舉止、涵養等，占25 分。 \n(3)言詞與表逹能力：包括思考與反應、言語表達、外文能力、邏輯概念 \n等，占25 分。 \n(4)學識與見解：學識及時事的見解，占25 分。 \n4.複選結果：面試後5 日內由本部函知推薦學校獲選送者名單。獲選送者\n須於3 月底前自行於捷克教育部之線上系統填寫申請文件並上傳所需附\n件。通過甄選獲選送者僅具本獎學金候選人資格，應獲捷克教育部核定，\n始取得正式受獎資格。 \n(三) 捷克院校審核：甄選產生之名單，俟轉交捷克教育部後，將由捷克各院校\n進行審核，並對最終錄取結果有自主權，捷克教育部將於115 年6 月底逕\n行通知申請者錄取結果。 \n九、其他應遵 \n守事項 \n(一) 申請者須先行確認受獎期間可出國進修/研究。 \n(二) 申請者應以捷克政府認可之高等教育機構為申請進修/研究之對象，詳細\n名單請參考附件，其中藝術類大學入學不易，請審慎考量。 \n(三) 建議申請者報名前逕與欲申請進修/研究之系所聯繫，報名時檢附該系所\n進修/研究之入學許可或邀請函，將有助簡化及加速入學程序。 \n(四) 進修/研究之期限、條件及語言要求，由所欲申請進修/研究之系所自行訂\n定，申請者是否被接受亦由所欲申請進修/研究之系所在捷克教育部獎學\n金計畫架構內自行決定。 \n(五) 申請者請於捷克教育部所提供之申請表詳列擬就讀學校志願，報名後請勿\n聯繫各院校，且不得更改志願次序，爰請申請者審慎決定擬就讀學校志\n願。捷克教育部保留審酌調整申請者志願次序之相關權利。 \n(六) 受獎者研習結束，返國後1 個月內，須提供研習心得報告1 篇，由推薦學\n校函送至本部。 \n(七) 本獎學金詳細資訊請參考捷克教育部網站：www.msmt.cz→EU and \nInternational affairs→Scholarships→Scholarship for the Academic Year \n2026/2027(https://www.msmt.cz/eu-and-internationalaffairs/scholarships-for-t\n\n3 \nth-academic-year-2026-2027)。 \n(八) 在捷克就讀及生活資訊可參考連結www.studyin.cz。 \n(九) 考量赴捷克短期進修/研究效益，倘逢捷克當地疫情、天災等不可抗力因\n素，本獎學金保有延期、變更或中止之權利。 \n\n4 \n教育部115 年赴捷克高等教育機構短期進修/研究獎學金甄選報名表 \n中文姓名 \n \n二吋正面半身脫帽 \n照片乙張 \n護照英文姓名 \n \n出生日期 \n民國 年 月 日 性\n別 \nE-mail \n \n聯絡電話 \n \n請勾選進修或\n研究時程 \n□5 個月 或 □10 個月 ※請務必勾選 \n學歷 \n_________大學________系□畢業/□____年級 \n_________大學________研究所碩士班□畢業/□____年級 \n_________大學________研究所博士班□畢業/□____年級 \n符合報名資格\n語言能力成績 \n1.在校任一學期捷語成績___分(需高於80 分) \n2.在校任一學期英語成績___分(需高於80 分) \n3.取得各項英檢與CEFR架構對照表B2級所列任一機構\n之語言檢定證明 \n□多益TOEIC 需兼具聽400 分、讀385 分、說160 分、寫\n150 分以上 \n□FLPT 外語能力測驗需兼具聽讀195 分、說S-2 應符合下列資格之一： \n1. 各直轄市、縣（市）主管機關認定之下列資格之一： \n(1) 低收入戶或中低收入戶 \n(3) 特殊境遇家庭扶助 \n(4) 身心障礙者生活補助費 \n(5) 弱勢兒童及少年生活扶助 \n(6) 弱勢家庭兒童及少年緊急生活扶助 \n(7) 同一戶籍內家屬具中低收入老人生活津貼補助資格 \n2. 具教育部大專校院弱勢學生助學計畫之助學金補助資格者(符合當年度該計畫助學金\n補助資格者可申請次年度計畫)。 \n3. 父或母領有身心障礙證明。 \n(二) 因配合教育部受理申請時程，報名截止日期為每年3月10日(9/15)；次年10月31日前出\n\n東海大學國際暨兩岸合作處\n \n東海大學赴全球姊妹校交換甄試簡章 General Information for Outbound Exchange Application P7 \n \n國交流。 \n(三) 審核及補助額度由教育部核定 \n在本校同一教育階段已申請學海惜珠並獲得補助者不得再次申請。 \n參與學生應通過薦送學校規定之專業及語言能力條件。 \n依補助要點規定，申請計畫補助者，同一申請人，同一教育階段，以補助一次為限。 \n有關學海計畫相關資訊請參閱國際處官網_獎學金 \n學海計畫官方網站 https://www.studyabroad.moe.gov.tw/new/index/portal \n \n東海大學國際移動躍升計畫獎補助實施要點 \n補助目的： \n教育部各年度大專校院精進校務經營計畫，培養本校學生全球化視野，提升國際競爭優勢及\n學生國際移動力，進而培育具國際觀的專業人才 \n補助活動項目： \n長期交換：經國際處或各院系遴選推薦，赴海外姊妹校進行交換、研習或修讀雙 \n聯學位，且研修期程為一學期（含）以上之學生；其就讀學校須符合下列條件之一： \n1. THE 或QS 世界大學排名前500 名； \n2. 該國國內排名前50 名； \n3. 經國際教育合作委員會專案認定具特殊學術價值之姊妹校。 \n清寒及特殊身分學生薦外補助：符合下列資格之一者，經國際處或各院系推薦赴 \n海外進行上述相關活動項目： \n1. 具有各直轄市、縣(市)主管機關認定之低收入戶或中低收入戶相關補助資格； \n2. 特殊境遇家庭子女； \n3. 原住民學生； \n4. 領有身心障礙證明之學生； \n5. 其他經專案審查認定有經濟困難者。 \n補助對象：須具中華民國國籍，且在臺灣地區設有戶籍之本校正式學籍之在學學生(未休 \n學)，前述學生修業年限應符合本校學則相關規定，且不含碩士在職專班。 \n申請時程： \n一、本要點每學年度分兩梯次受理申請： \n1. \n第一梯次：每年三月一日至三月三十一日； \n2. \n第二梯次：每年九月一日至九月三十日。 \n\n東海大學國際暨兩岸合作處\n \n東海大學赴全球姊妹校交換甄試簡章 General Information for Outbound Exchange Application P8 \n \n如有剩餘經費，得視情況增開梯次，相關資訊另行公告於國際處網站。 \n二、長期交換及清寒暨特殊身分學生薦外補助：由學生填寫並送出線上申請表，並於 \n公告期限內繳交相關申請文件至國際暨兩岸合作處彙整，提送東海大學國際教育合作委\n員會常務工作小組審查，擇優核給獎補助金。 \n有關獎學金詳細申請資訊請參閱國際處官網_獎學金 \n \n \n東海大學學生參加英語檢定考試補助辦法 \n第一條 \n本校為鼓勵學生取得英語能力認證，提昇本校學生英語能力，提升學生國際移動力，特訂定 \n「東海大學學生參加英語檢定考試補助辦法」（以下簡稱本辦法）。 \n第二條 \n補助資格： \n本校各學制具正式學籍之在學學生，於在學期間參加英語能力檢定考試，經測驗合格並取得 \n成績證明，且其成績達本辦法所定標準以上者，得依規定申請補助。 \n前項補助資格，依當年度經費來源區分如下： \n（一）經費來源為校內經費預算時，外籍學生得提出申請，惟其國籍國官方語言之一為 \n英語者，不得申請。 \n（二）經費來源為教育部預算時，限本國籍者，申請人須具中華民國國籍。 \n第三條 \n獎勵項目： \n本補助以學生在學期間為限，採隨到隨審方式辦理；每人每一檢定項目限申請一次，不同檢 \n定項目得分別申請，惟在學期間補助總額以新臺幣15,000 元為上限。申請案經審核通過 \n後，依校內相關程序辦理補助核發，其補助金額依下表辦理。 \n英語能力檢定補助 \n補助金額 \n語言門檻標準 \n雅思國際英文測驗\n(IELTS)-學術組 \n7,000 \n5.5-6.4 \n7,500 \n6.5或以上 \n網路托福測驗(iBT) \n＊不採認MY B   $("#pos").textContent = `${cur+1} / ${list.length}`;
  $("#jump").value = cur+1;
  $("#inTitle").textContent = d[0];
  $("#inMeta").innerHTML = `${esc(d[1])} · ${esc(c.doc_id)}` + (d[3] ? ` · <a href="${esc(d[3])}" target="_blank" rel="noopener">source</a>` : "");
  $("#inText").textContent = d[2];
  document.querySelectorAll(".labels button").forEach(b => b.classList.toggle("on", b.dataset.l === r.label));
  $("#field").value = r.field; $("#notes").value = r.notes;
  document.querySelectorAll("[data-flag]").forEach(x => x.checked = r.flags.includes(x.dataset.flag));
  const ids = [...new Set([...c.candidates, ...(extra[c.case_id]||[]), ...r.targets])];
  $("#cands").innerHTML = ids.map((id,k) => {
    const x = DATA.docs[id] || ["(unknown)", "", "", ""];
    return `<div class="cand ${r.targets.includes(id)?"on":""}" data-id="${esc(id)}">
      <label><input type="checkbox" ${r.targets.includes(id)?"checked":""}><span><span class="kbd">${k<9?k+1:""}</span> <span class="t">${esc(x[0])}</span> <span class="meta">${esc(x[1])} · ${esc(id)}</span></span></label>
      <div class="x">${esc(x[2])}</div></div>`;
  }).join("");
  $("#search").value = ""; $("#hits").innerHTML = "";
  const n = DATA.cases.filter(c => labels[c.case_id]?.label).length;
  $("#progress").innerHTML = `<span class="done">${n}</span> / ${DATA.cases.length} labeled`;
}

function setLabel(l){ const r = rec(cases()[cur]); r.label = l; if (l === "NEW") r.targets = []; save(); render(); }
function toggle(id){ const r = rec(cases()[cur]); r.targets = r.targets.includes(id) ? r.targets.filter(x=>x!==id) : [...r.targets, id]; save(); render(); }
function go(i){ save(); cur = i; render(); window.scrollTo(0,0); }

document.querySelectorAll(".labels button").forEach(b => b.onclick = () => setLabel(b.dataset.l));
$("#cands").onclick = e => {
  const card = e.target.closest(".cand"); if (!card) return;
  if (e.target.closest(".x")) { card.classList.toggle("open"); return; }
  if (e.target.matches("input")) toggle(card.dataset.id);
};
$("#field").onchange = e => { rec(cases()[cur]).field = e.target.value; save(); };
$("#notes").oninput = e => { rec(cases()[cur]).notes = e.target.value; store.set(labels); };
document.querySelectorAll("[data-flag]").forEach(x => x.onchange = () => {
  const r = rec(cases()[cur]); r.flags = [...document.querySelectorAll("[data-flag]:checked")].map(y => y.dataset.flag); save();
});
$("#prev").onclick = () => go(cur-1);
$("#next").onclick = () => go(cur+1);
$("#nextOpen").onclick = () => { const l = cases(); const i = l.findIndex((c,k) => k > cur && !labels[c.case_id]?.label); if (i >= 0) go(i); };
$("#jump").onchange = e => go(+e.target.value - 1);
$("#kappaOnly").onchange = () => go(0);
$("#annot").value = (() => { try { return localStorage.getItem(KEY+"_who") || ""; } catch { return ""; } })();
$("#annot").oninput = e => { try { localStorage.setItem(KEY+"_who", e.target.value); } catch {} };
$("#search").oninput = e => {
  const q = e.target.value.trim().toLowerCase(), c = cases()[cur];
  if (q.length < 2) { $("#hits").innerHTML = ""; return; }
  const hits = Object.entries(DATA.docs).filter(([id,d]) => d[1] < c.date && d[0].toLowerCase().includes(q))
    .sort((a,b) => b[1][1].localeCompare(a[1][1])).slice(0, 15);
  $("#hits").innerHTML = hits.map(([id,d]) => `<div data-id="${esc(id)}">${esc(d[1])} · ${esc(d[0])}</div>`).join("") || '<div class="meta">no match</div>';
};
$("#hits").onclick = e => { const id = e.target.closest("[data-id]")?.dataset.id; if (!id) return; const c = cases()[cur]; (extra[c.case_id] ||= []).push(id); render(); };

document.addEventListener("keydown", e => {
  if (e.target.matches("input[type=text],input:not([type]),textarea,select") || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === "u") setLabel("UPDATE"); else if (k === "n") setLabel("NEW"); else if (k === "r") setLabel("REDUNDANT");
  else if (k === "j" || k === "arrowright") go(cur+1); else if (k === "k" || k === "arrowleft") go(cur-1);
  else if (/^[1-9]$/.test(k)) { const card = document.querySelectorAll(".cand")[+k-1]; if (card) toggle(card.dataset.id); }
});
window.addEventListener("beforeunload", save);

function csvCell(s){ s = String(s ?? ""); return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; }
$("#export").onclick = () => {
  save();
  const rows = [["case_id","gold_label","gold_target","changed_field","notes","annotator","seconds"]];
  for (const c of DATA.cases) { const r = labels[c.case_id]; if (!r?.label) continue;
    rows.push([c.case_id, r.label, r.targets.join("|"), r.field, [r.flags.join(" "), r.notes].filter(Boolean).join(" | "), r.annotator||$("#annot").value, r.seconds]); }
  const blob = new Blob(["﻿" + rows.map(r => r.map(csvCell).join(",")).join("\n")], {type:"text/csv"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = `labels_${DATA.corpus}_${$("#annot").value || "anon"}.csv`; a.click();
};
$("#importBtn").onclick = () => $("#import").click();
$("#import").onchange = async e => {
  const text = (await e.target.files[0].text()).replace(/^﻿/, "");
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) { const ch = text[i];
    if (q) { if (ch === '"' && text[i+1] === '"') { cell += '"'; i++; } else if (ch === '"') q = false; else cell += ch; }
    else if (ch === '"') q = true; else if (ch === ",") { row.push(cell); cell = ""; }
    else if (ch === "\n") { row.push(cell.replace(/\r$/,"")); rows.push(row); row = []; cell = ""; } else cell += ch; }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  const [h, ...body] = rows; const ix = n => h.indexOf(n);
  const FLAGS = ["unsure","template_trap","reworded","translation","old_predecessor"];
  for (const r of body) { if (!r[ix("case_id")]) continue;
    const [flagPart, ...rest] = (r[ix("notes")]||"").split(" | ");
    const flags = flagPart.split(" ").filter(f => FLAGS.includes(f));
    labels[r[ix("case_id")]] = { label: r[ix("gold_label")], targets: (r[ix("gold_target")]||"").split("|").filter(Boolean),
      field: r[ix("changed_field")]||"", flags, notes: flags.length ? rest.join(" | ") : (r[ix("notes")]||""),
      seconds: +r[ix("seconds")]||0, annotator: r[ix("annotator")] }; }
  store.set(labels); render();
};
render();
</script>
</body>
</html>
